      ${can("submit") ? `
        <div style="border-top:1px solid var(--s-100);margin-top:.875rem;padding-top:.875rem">
          <label class="label" for="sb-kind">ارسال به ${esc(ROLES.manager.name)}</label>
          <select class="field" id="sb-kind">
            <option value="approval">🖋 درخواست تأیید نهایی</option>
            <option value="report">📋 گزارش کار</option>
          </select>
          <textarea class="field" id="sb-note" rows="3" style="margin-top:.625rem"
            placeholder="چه چیزی را می‌فرستید و از مدیر چه می‌خواهید؟"></textarea>
          <div class="row" style="margin-top:.625rem">
            <button class="btn btn-primary btn-sm" data-submit-doc="${d.id}">ارسال به مدیر</button>
            <span class="muted small">متن شما در گفت‌وگوی همین سند هم ثبت می‌شود.</span>
          </div>
        </div>` : ""}
    </div>`;
}

function confirmModal(title, message, confirmLabel, danger, onYes) {
  state.modal = { type: "confirm", title: title, message: message, confirmLabel: confirmLabel, danger: danger, onYes: onYes };
  render();
}

function addFiles(fileList) {
  const m = currentMeeting();
  if (!m || !fileList || !fileList.length) return;
  let added = 0; const rejected = [];

  Array.prototype.forEach.call(fileList, (f) => {
    const ext = extOf(f.name);
    if (AUDIO_EXT.indexOf(ext) === -1 && DOC_EXT.indexOf(ext) === -1) {
      rejected.push(f.name + " — قالب پشتیبانی نمی‌شود");
      return;
    }
    if (f.size > 200 * 1024 * 1024) { rejected.push(f.name + " — حجم بیش از حد مجاز"); return; }
    const src = {
      id: nid("s"),
      name: f.name.replace(/^.*[\\/]/, ""),
      type: AUDIO_EXT.indexOf(ext) !== -1 ? "audio" : "document",
      size: f.size, status: "uploaded",
    };
    m.sources.push(src);
    // Plain text the browser can actually read is read, so the minutes come
    // from the visitor's own words rather than from a sample.
    if (TEXT_EXT.indexOf(ext) !== -1 && f.size <= 1048576) {
      const reader = new FileReader();
      reader.onload = () => { src.text = String(reader.result || ""); src.chars = src.text.length; render(); };
      reader.readAsText(f);
    }
    added++;
  });

  if (added && m.status === "draft") m.status = "uploaded";
  if (added) toast(fa(added) + " فایل بارگذاری شد");
  rejected.forEach((r) => toast(r));
  render();
}

/* ==========================================================================
   Deriving a minutes document from what was actually uploaded

   Rule-based on purpose. What this product sells is not "the model writes
   well" — it is "nothing appears in the minutes that is not in your files".
   So every decision, action, risk and question below is built from one line of
   one source and keeps that line as its evidence. Better sentences can be
   layered on later; the citation is the part that has to be true from day one.
   ========================================================================== */

/* Which bucket a line belongs in. First cue wins, so the order is the
   priority: an instruction that happens to end in a question mark is an
   action, not an open question. */
const CUES = [
  ["decision", [/تصویب\s*شد/, /مصوب/, /مقرر\s*شد/, /تصمیم\s*(?:گرفته\s*شد|گرفتیم|می‌?گیریم|بر\s*این\s*شد)/,
                /موافقت\s*شد/, /قرار\s*شد/, /approved/i, /decided/i]],
  ["action",   [/مسئول/, /مهلت/, /آماده\s*کن/, /تهیه\s*کن/, /پیگیری\s*کن/, /ارسال\s*کن/, /بررسی\s*کن/,
                /رزرو\s*کن/, /تکمیل\s*کن/, /به‌?روزرسانی/, /باید\s*\S+\s*(?:کند|کنند|شود|دهد)/,
                /خواهشمند\s*است/, /دستور\s*فرمایید/, /مقتضی\s*است/,
                /(?:اعلام|ارسال|اقدام)\s*(?:شود|گردد|فرمایید)/,
                /\bwill\b/i, /action item/i]],
  ["proposal", [/پیشنهاد/, /شاید\s*بهتر/, /تصمیمی\s*(?:گرفته\s*)?نشد/, /به\s*تصمیم\s*نرسید/, /مطرح\s*شد/, /proposed/i]],
  ["risk",     [/ریسک/, /خطر/, /مشکل‌?ساز/, /تأخیر|تاخیر/, /متوقف/, /آماده\s*(?:نشده|نکرده|نیست)/,
                /مسدود/, /blocked/i, /\brisk\b/i]],
  ["question", [/مشخص\s*نیست/, /معلوم\s*نیست/, /نامشخص/, /باید\s*(?:اول\s*)?\S*\s*چک\s*کنیم/,
                /(?:چقدر|چند\s|آیا|چه\s*زمانی|چه\s*کسی|تعیین\s*تکلیف)[^.]*[؟?]/]],
];

/* The unit everything works on: the line an answer can quote, a claim can be
   read from, and a decision can be recognised in. A colon deliberately does
   not end one — "مسئول: سارا" is a single clause, and splitting it there turns
   a name into a stray punctuation mark. */
function clauses(text) {
  return String(text || "").split(/(?<=[.؛!؟])\s+|\n+/)
    .map((x) => x.trim()).filter((x) => x.length > 12);
}

function classify(text) {
  for (const pair of CUES) {
    for (const re of pair[1]) if (re.test(text)) return pair[0];
  }
  return null;
}
/* Lines that are structure rather than content: table headers, section
   labels, the "حاضران:" line the participant reader has already used. */
const META_RE = /^(?:حاضران|حاضرین|غایب(?:ان)?|غائبین|شرکت‌?کنندگان|تاریخ|ساعت|زمان|محل|مکان|هدف|موضوع|objective|date|time|location|attendees)\s*[:：]/i;

function isTableHeader(cells) {
  return cells.every((c) => c.length <= 14) &&
         cells.some((c) => /^(?:عنوان|مسئول|مهلت|وضعیت|شرح|title|owner|due|status)$/i.test(c));
}

/* One source, broken into the units a person would point at. A recording is
   its turns; a document is its lines, and only a long paragraph is cut further
   into sentences. */
function statementsOf(s) {
  const out = [];
  if (s.turns && s.turns.length) {
    s.turns.forEach((t, i) => out.push({
      src: s.name, type: "audio", text: t.text.trim(), who: speakerLabel(s, t.speaker), i: i,
    }));
    return out;
  }
  const type = s.type === "audio" ? "audio" : "document";
  String(s.text || "").split(/\n+/).forEach((raw, i) => {
    const line = raw.trim();
    if (!line) return;
    if (/^#{1,6}\s/.test(line)) {
      out.push({ src: s.name, type: type, text: line.replace(/^#{1,6}\s*/, ""),
                 heading: true, level: (/^#+/.exec(line) || ["#"])[0].length, i: i });
      return;
    }
    if (line.length > 260) {
      clauses(line).forEach((sn) => out.push({ src: s.name, type: type, text: sn, i: i }));
      return;
    }
    out.push({ src: s.name, type: type, text: line, i: i });
  });
  return out;
}

/* ---- the fields an item is made of ------------------------------------- */

const DEADLINE_RES = [
  /مهلت\s*[:：]?\s*([^|—\n]{2,30})/,
  /(تا\s+(?:پایان\s+)?(?:هفتهٔ?\s+آینده|ماه\s+آینده|آخر\s+هفته|[^\s،.؛]{2,18}))/,
  /(پیش\s+از\s+[^\s،.؛]{2,20})/,
  /\b(by\s+(?:next\s+week|[A-Za-z]+day|[A-Za-z]+\s+\d{1,2}))\b/i,
];
function extractDeadline(text) {
  for (const re of DEADLINE_RES) {
    const m = re.exec(text);
    if (m) {
      const v = m[1].trim().replace(/[.،؛:]+$/, "");
      if (v && !/^(?:این|آن|همان)$/.test(v.replace(/^تا\s+/, ""))) return v;
    }
  }
  return null;
}

const UNKNOWN_OWNER = /^(?:؟|\?|-|—|نامشخص|مشخص\s*نشده|نامعلوم)$/;
function extractOwner(text, known) {
  let m = /مسئول(?:\s+[آ-ی]{2,})?\s*[:：]\s*([^|—\n،.:：]{1,30})/.exec(text)
       || /مسئول\s+([آ-ی]{2,}(?:\s+[آ-ی]{2,})?)\s*(?:[—–|]|$)/.exec(text);
  if (m) {
    const v = m[1].trim();
    if (!v || UNKNOWN_OWNER.test(v) || !/[آ-یA-Za-z]/.test(v)) return null;
    return fullName(v, known);
  }
  // "علی، می‌شود …" — in a meeting the person addressed is the person asked.
  m = /(?:^|[.!؟]\s*)([آ-ی]{2,}(?:\s[آ-ی]{2,})?)\s*،\s/.exec(text);
  if (m && !STOP.has(norm(m[1])) && !/^(?:یک\s|این|آن|بله|خب)/.test(m[1])) return fullName(m[1].trim(), known);
  m = /(^|\s)([A-Z][a-z]{2,})\s+will\b/.exec(text);
  if (m) return fullName(m[2], known);
  for (const k of known) if (text.indexOf(k) !== -1) return k;
  return null;
}
/* "علی" and "علی رضایی" are the same person; the minutes should print the
   name the attendance line gave. */
function fullName(name, known) {
  const hit = known.find((k) => k === name || k.split(" ").indexOf(name) !== -1);
  return hit || name;
}

const STATUS_WORDS = [[/انجام\s*‌?شده|انجام\s*شد|done|completed/i, "done"],
                      [/در\s*حال\s*انجام|in progress/i, "in_progress"],
                      [/متوقف|بلاتکلیف|blocked/i, "blocked"]];
function extractStatus(text) {
  for (const pair of STATUS_WORDS) if (pair[0].test(text)) return pair[1];
  return "open";
}

/* The sentence — or the clause — that actually carries the cue, cleaned up
   enough to be read as a heading. */
function headline(kind, st) {
  const res = (CUES.find((c) => c[0] === kind) || [null, []])[1];
  const carries = (x) => res.some((re) => re.test(x));
  const longest = (list) => list.slice().sort((a, b) => b.length - a.length)[0];

  let best = st.text;
  // Among the sentences that carry the cue, the fullest one states the point;
  // the short ones are "…خوب، تصویب شد" and say nothing on their own.
  const sents = clauses(st.text).filter(carries);
  if (sents.length) best = longest(sents);
  if (best.length > 70 && best.indexOf("،") !== -1) {
    const clauses = best.split("،").map((c) => c.trim()).filter((c) => c.length >= 12 && carries(c));
    if (clauses.length) best = longest(clauses);
  }
  best = best
    .replace(/^[…\.\s]+/, "")
    .replace(/^(?:یک\s*نکته|نکته|توجه|ضمناً)\s*[:：]\s*/, "")
    .replace(/^[آ-ی]{2,}(?:\s[آ-ی]{2,})?\s*،\s*/, "")     // "علی، …"
    .replace(/^(?:می‌?شود|لطفاً|لطفا|خواهشمند است)\s+/, "")
    .replace(/^[-•*۰-۹0-9]+[.)]?\s*/, "")                  // list bullets and numbering
    .replace(/\s*[—–]\s*(?:مصوب|تصویب\s*شد|approved)\s*$/i, "")
    .replace(/\s*[.؟?!،]+\s*$/, "")
    .trim();
  return best.length > 140 ? best.slice(0, 137).trim() + "…" : best;
}

/* ---- who was there ------------------------------------------------------ */

function splitPeople(v) {
  return v.split(/[،,؛]/).map((x) => x.trim()).filter(Boolean).map((x) => {
    const m = /^(.+?)\s*[(（]\s*(.+?)\s*[)）]\s*$/.exec(x);
    return m ? { name: m[1].trim(), role: m[2].trim() } : { name: x, role: null };
  }).filter((p) => p.name.length > 1 && p.name.length < 40);
}

/* "علی" in the transcript and "علی رضایی" on the attendance line are one
   person; so are "آقای کریمی" and "حسن کریمی". */
function samePerson(a, b) {
  const A = norm(a).split(" ").filter((x) => x.length > 1);
  const B = norm(b).split(" ").filter((x) => x.length > 1);
  if (!A.length || !B.length) return false;
  const short = A.length <= B.length ? A : B;
  const long = A.length <= B.length ? B : A;
  return short.every((t) => long.indexOf(t) !== -1);
}

/* Titles and the words that happen to sit next to a name are not the name. */
const NOT_A_NAME = new Set(("آقای خانم جناب سرکار دکتر مهندس امروز فردا دیروز هنوز عملاً " +
  "همچنان ایشان جلسه").split(" ").map(norm));
function personName(raw) {
  const parts = String(raw).trim().split(/\s+/)
    .filter((w) => w.length > 1 && !NOT_A_NAME.has(norm(w)) && !STOP.has(norm(w)));
  const name = parts.slice(-2).join(" ").trim();
  return name.length > 2 ? name : null;
}

function collectPeople(sources, stmts) {
  const participants = [], absentees = [];
  const add = (list, p) => {
    if (!p.name) return;
    const twin = list.find((x) => samePerson(x.name, p.name));
    if (!twin) { list.push(p); return; }
    if (p.name.length > twin.name.length) twin.name = p.name;   // the fuller name wins
    if (!twin.role && p.role) twin.role = p.role;
  };

  // A voice that someone has put a name to is a participant we can prove.
  sources.forEach((s) => {
    if (!s.turns || !s.speakerNames) return;
    Object.keys(s.speakerNames).forEach((label) => {
      const n = String(s.speakerNames[label] || "").trim();
      if (n) add(participants, { name: n, role: null });
    });
  });

  stmts.forEach((st) => {
    let m = /^(?:حاضران|حاضرین|شرکت‌?کنندگان|attendees)\s*[:：]\s*(.+)$/i.exec(st.text);
    if (m) splitPeople(m[1]).forEach((p) => add(participants, p));
    m = /^(?:غایب(?:ان)?|غائبین|absent)\s*[:：]\s*(.+)$/i.exec(st.text);
    if (m) splitPeople(m[1]).forEach((p) => add(absentees, p));
    m = /((?:[آ-ی]{2,}\s+){0,3}[آ-ی]{2,})\s+(?:در\s*مرخصی|مرخصی|غایب|حضور\s*ندارند|حضور\s*ندارد)/.exec(st.text);
    if (m) {
      const name = personName(m[1]);
      if (name) add(absentees, { name: name, role: null });
    }
  });

  const names = participants.map((p) => p.name).concat(absentees.map((p) => p.name));
  return { participants: participants, absentees: absentees, names: names };
}

/* ---- what was on the table ---------------------------------------------- */

const SKIP_HEADING = /تصمیم|اقدام|حاضر|غایب|action|decision|attendee/i;

function agendaSources(stmts) {
  const names = {};
  stmts.forEach((st) => { if (/agenda|دستور\s*جلسه/i.test(st.text)) names[st.src] = true; });
  return names;
}

function collectTopics(stmts, agendas) {
  const topics = [];
  let current = null;
  stmts.forEach((st) => {
    if (st.heading) {
      // "# یادداشت‌های جلسه" is the document's own title, not a topic in it.
      current = (st.level === 1 || SKIP_HEADING.test(st.text)) ? null
        : { title: st.text.replace(/^[۰-۹0-9]+[.)]\s*/, ""), summary: null, points: [] };
      if (current) topics.push(current);
      return;
    }
    // An agenda line — "1. Q2 sales performance review (Ali, 20 min)".
    const ag = /^[۰-۹0-9]+[.)]\s+(.{6,90})$/.exec(st.text);
    if (ag && agendas[st.src] && !classify(st.text)) {
      topics.push({ title: ag[1].replace(/\s*\([^)]*\)\s*$/, "").trim(), summary: null, points: [] });
      current = null;
      return;
    }
    if (current && /^[-•*]\s+/.test(st.text)) current.points.push(st.text.replace(/^[-•*]\s+/, "").trim());
    else if (current && !current.summary && st.text.length > 20 && !classify(st.text)) current.summary = st.text;
  });
  return topics.filter((t) => t.title.length > 2).slice(0, 8);
}

function collectInfo(m, stmts) {
  const info = {
    date: m.date || null,
    time: m.time || null,
    location: m.location || null,
    objective: m.description || null,
  };
  stmts.forEach((st) => {
    let x = /^(?:هدف(?:\s*جلسه)?|موضوع|objective)\s*[:：]\s*(.+)$/i.exec(st.text);
    if (x && !info.objective) info.objective = x[1].trim();
    x = /^(?:محل|مکان|location)\s*[:：]\s*(.+)$/i.exec(st.text);
    if (x && !info.location) info.location = x[1].trim();
    x = /(?:ساعت|زمان|time)\s*[:：]\s*([0-9۰-۹][^|\n]{2,20})/i.exec(st.text);
    if (x && !info.time) info.time = x[1].trim();
  });
  return info;
}

/* ---- two lines that say the same thing are one line with two sources ----- */

function overlap(a, b) {
  const A = new Set(terms(a)), B = new Set(terms(b));
  if (A.size < 2 || B.size < 2) return 0;
  let n = 0;
  A.forEach((t) => { if (B.has(t)) n += 1; });
  return n / Math.min(A.size, B.size);
}

function mergeSame(items, keyOf) {
  const out = [];
  items.forEach((item) => {
    const twin = out.find((x) => overlap(keyOf(x), keyOf(item)) >= 0.6);
    if (!twin) { out.push(item); return; }
    // Keep the fuller record, and keep both citations.
    item.evidence.forEach((e) => {
      if (!twin.evidence.some((x) => x.src === e.src && x.quote === e.quote)) twin.evidence.push(e);
    });
    if (item.owner && !twin.owner) { twin.owner = item.owner; twin.ownerConfirmed = item.ownerConfirmed; }
    if (item.deadlineText && !twin.deadlineText && !twin.deadline) twin.deadlineText = item.deadlineText;
    if (twin.status === "open" && item.status && item.status !== "open") twin.status = item.status;
    if (keyOf(item).length > keyOf(twin).length + 12 && twin.context == null) twin.context = keyOf(item);
  });
  return out;
}

/* ---- the document ------------------------------------------------------- */

function deriveMinutes(m, sources) {
  const usable = sources.filter((s) => s.text || (s.turns && s.turns.length));
  const stmts = [];
  usable.forEach((s) => statementsOf(s).forEach((st) => stmts.push(st)));

  const agendas = agendaSources(stmts);
  const people = collectPeople(usable, stmts);
  const info = collectInfo(m, stmts);
  const evidenceOf = (st) => [{ src: st.src, type: st.type, quote: st.text }];

  const decisions = [], actions = [], proposals = [], risks = [], questions = [], leftovers = [];

  stmts.forEach((st, idx) => {
    if (st.heading || META_RE.test(st.text) || st.text.length < 12) return;
    // Already read as a topic by collectTopics.
    if (agendas[st.src] && /^[۰-۹0-9]+[.)]\s+/.test(st.text)) return;

    // "عنوان | مسئول | مهلت | وضعیت" and the rows under it.
    const cells = st.text.split("|").map((c) => c.trim()).filter(Boolean);
    if (cells.length >= 3) {
      if (isTableHeader(cells)) return;
      actions.push({
        id: nid("a"), title: cells[0], desc: null,
        owner: UNKNOWN_OWNER.test(cells[1]) ? null : fullName(cells[1], people.names),
        ownerConfirmed: false, deadline: null,
        deadlineText: UNKNOWN_OWNER.test(cells[2]) ? null : cells[2],
        priority: null, status: extractStatus(cells[3] || ""), evidence: evidenceOf(st),
      });
      return;
    }

    // One turn can settle one thing, promise another and flag a third, so the
    // sentence is what gets classified — while the citation stays the whole
    // statement, because a quote has to be readable on its own.
    const units = clauses(st.text).length ? clauses(st.text) : [st.text];
    const pick = {};
    units.forEach((u, ui) => {
      const k = classify(u);
      if (!k) return;
      if (!pick[k] || u.length > pick[k].text.length) pick[k] = { text: u, at: ui };
    });
    const kinds = Object.keys(pick);
    if (!kinds.length) { if (worthKeeping(st.text)) leftovers.push(st); return; }

    kinds.forEach((kind) => {
      const unit = pick[kind].text;
      const title = headline(kind, { text: unit });
      if (title.length < 8) return;

      if (kind === "decision") {
        decisions.push({ id: nid("d"), text: title, context: null,
          by: st.who && !/^گویندهٔ/.test(st.who) ? st.who : null, evidence: evidenceOf(st) });
      } else if (kind === "action") {
        const next = stmts[idx + 1];
        const owner = extractOwner(unit, people.names);
        let due = extractDeadline(unit);
        // A line written as "عنوان — مسئول: علی — مهلت: جمعه" keeps only its
        // first part as the title; the rest is already in the fields.
        const parts = unit.split(/\s*[—–]\s*/);
        let structured = parts.length > 1 && /مسئول|مهلت/.test(unit)
          ? parts[0].replace(/^[-•*۰-۹0-9]+[.)]?\s*/, "").trim() : null;
        // "…تأمین شود. مسئول پیگیری: خانم موسوی — مهلت: ۱۵ آبان." A clause that
        // is nothing but fields does not name the work; the clause before it does.
        if (/^(?:مسئول|مهلت|وضعیت|اولویت)/.test(structured || title)) {
          const prev = units[pick[kind].at - 1];
          structured = prev ? headline("action", { text: prev }) : structured;
        }
        // "…آماده کنی؟" — "بله، تا جمعه." The commitment is in the reply.
        if (!due && next && next.type === "audio" && next.src === st.src && next.text.length < 120) {
          due = extractDeadline(next.text);
        }
        actions.push({
          id: nid("a"), title: structured && structured.length >= 8 ? structured : title,
          desc: null, owner: owner, ownerConfirmed: false, deadline: null, deadlineText: due,
          priority: null, status: extractStatus(unit), evidence: evidenceOf(st),
        });
      } else if (kind === "proposal") {
        proposals.push({ id: nid("p"), text: title,
          context: "مطرح شد اما در این ورودی به تصمیم قطعی نرسیده است.", evidence: evidenceOf(st) });
      } else if (kind === "risk") {
        risks.push({ text: title, impact: null, mitigation: null, evidence: evidenceOf(st) });
      } else {
        questions.push({ text: title, context: null, evidence: evidenceOf(st) });
      }
    });
  });

  const dec = mergeSame(decisions, (x) => x.text);
  const act = mergeSame(actions, (x) => x.title);
  const pro = mergeSame(proposals, (x) => x.text);
  const rsk = mergeSame(risks.map((r) => Object.assign(r, { owner: null, status: "open" })), (x) => x.text)
    .map((r) => ({ text: r.text, impact: r.impact, mitigation: r.mitigation, evidence: r.evidence }));
  const qst = mergeSame(questions.map((q) => Object.assign(q, { owner: null, status: "open" })), (x) => x.text)
    .map((q) => ({ text: q.text, context: q.context, evidence: q.evidence }));

  // Anyone named as responsible was in the room, whatever the attendance line said.
  act.forEach((a) => {
    if (a.owner && !people.participants.some((p) => norm(p.name) === norm(a.owner)) &&
        !people.absentees.some((p) => norm(p.name) === norm(a.owner))) {
      people.participants.push({ name: a.owner, role: null });
    }
  });

  const summary = buildSummary(m, info, dec, act, pro, rsk, leftovers);

  return {
    title: m.title || (DOC_KINDS[m.kind || "meeting_minutes"].label + " بدون عنوان"),
    info: info,
    summary: summary,
    participants: people.participants,
    absentees: people.absentees,
    topics: collectTopics(stmts, agendas),
    decisions: dec,
    proposals: pro,
    actions: act,
    questions: qst,
    risks: rsk,
    nextSteps: [],
    notes: leftovers.slice(0, 3).map((st) => st.text),
    sourcesUsed: usable.map((s) => s.name),
    failedSources: sources.filter((s) => s.status === "failed").map((s) => s.name),
    derived: true,
    simulatedSources: usable.filter((s) => s.simulated).map((s) => s.name),
    model: "استخراج قاعده‌محور — نسخهٔ نمایشی",
    generatedAt: new Date().toISOString(),
  };
}

/* Small talk carries a meeting but says nothing afterwards. */
const CHATTER = /^(?:خب|سلام|بله|عالی|خیلی\s*خوب|ممنون|متشکرم|درست است|موافقم|بسیار\s*خوب)\b|سلام\s*به\s*همه|شروع\s*می‌?کنیم|برویم\s*سراغ/;
function worthKeeping(text) {
  if (text.length < 45 || CHATTER.test(text)) return false;
  // A number, a percentage or a proper noun is the mark of a line that reports
  // something rather than moves the meeting along.
  return /[0-9۰-۹]/.test(text) || text.length > 90;
}

/* A summary a manager can act on: what was settled, what is owed, what is
   still open. Built from the extracted items so it can never say something the
   sources do not. */
function buildSummary(m, info, dec, act, pro, rsk, leftovers) {
  const parts = [];
  if (info.objective) parts.push("هدف این ورودی: " + info.objective.replace(/\s*[.،]\s*$/, "") + ".");
  else if (leftovers.length) parts.push(leftovers[0].text.replace(/\s*[.،]\s*$/, "") + ".");

  if (dec.length) parts.push(fa(dec.length) + " تصمیم ثبت شد؛ از جمله «" + dec[0].text + "».");
  else parts.push("در این ورودی تصمیم قطعی ثبت نشده است.");

  if (act.length) {
    const owned = act.filter((a) => a.owner).length;
    parts.push(fa(act.length) + " اقدام استخراج شد" +
      (owned < act.length ? " که برای " + fa(act.length - owned) + " مورد آن مسئولی مشخص نشده است." : " و برای همه مسئول مشخص است."));
  }
  if (pro.length) parts.push("«" + pro[0].text + "» مطرح شد اما به تصمیم نرسید.");
  if (rsk.length) parts.push("ریسک ثبت‌شده: " + rsk[0].text + ".");
  return parts.join(" ");
}

/* A browser cannot transcribe an MP3 or read a scanned PDF. Rather than let a
   demo invent a result and present it as the visitor's own file, the sample
   text is attached to the source itself and labelled as a sample wherever it
   appears — so the minutes really are derived from something readable, and
   nobody is left thinking their own recording produced it. */
function simulateSource(s) {
  if (s.text || (s.turns && s.turns.length)) return;
  s.simulated = true;
  if (s.type === "audio") {
    s.turns = TRANSCRIPT_TURNS.map((t) => ({ speaker: t.speaker, text: t.text }));
    s.speakerNames = {};
    s.diarized = true;
    s.segments = true;
    s.duration = s.duration || 2340;
    s.text = speakerText(s);
  } else {
    s.text = NOTES_TEXT;
  }
}

/* Walks the six stages the real worker reports, then attaches minutes. */
function runPipeline(m, isRegeneration) {
  if (!m || !m.sources.length) return;

  m.status = "processing";
  m.job = {
    status: "running", error: null, isRegeneration: isRegeneration,
    stages: STAGE_DEFS.map((d) => ({ key: d.key, label: d.label, state: "pending", detail: null })),
  };
  m.sources.forEach((s) => { if (s.status !== "failed") s.status = "uploaded"; });
  render();

  const docs = m.sources.filter((s) => s.type === "document");
  const auds = m.sources.filter((s) => s.type === "audio");
  const stages = m.job.stages;

  const steps = [
    () => { stages[0].state = "done"; stages[0].detail = fa(m.sources.length) + " فایل"; },
    () => {
      if (!docs.length) { stages[1].state = "skipped"; stages[1].detail = "سند متنی وجود ندارد"; return; }
      stages[1].state = "running";
      docs.forEach((s) => { if (s.status !== "failed") s.status = "processing"; });
    },
    () => {
      docs.forEach((s) => {
        if (s.status === "failed") return;
        s.status = "processed";
        simulateSource(s);
        s.chars = (s.text || "").length;
      });
      const bad = docs.filter((s) => s.status === "failed").length;
      const ok = docs.length - bad;
      if (docs.length) { stages[1].state = "done"; stages[1].detail = bad ? fa(ok) + " موفق، " + fa(bad) + " ناموفق" : fa(ok) + " مورد"; }
    },
    () => {
      if (!auds.length) { stages[2].state = "skipped"; stages[2].detail = "فایل صوتی وجود ندارد"; return; }
      stages[2].state = "running";
      auds.forEach((s) => { s.status = "processing"; });
    },
    () => {
      auds.forEach((s) => {
        s.status = "processed";
        simulateSource(s);
        s.chars = (s.text || "").length;
        if (!s.duration) s.duration = 900 + Math.floor(Math.random() * 2400);
      });
      if (auds.length) { stages[2].state = "done"; stages[2].detail = fa(auds.length) + " مورد"; }
    },
    () => { stages[3].state = "running"; },
    () => {
      const ok = m.sources.filter((s) => s.status === "processed").length;
      stages[3].state = "done"; stages[3].detail = fa(ok) + " منبع تحلیل شد";
      stages[4].state = "running";
    },
    () => { stages[4].state = "done"; stages[4].detail = "بدون هشدار"; stages[5].state = "running"; },
    () => {
      const processed = m.sources.filter((s) => s.status === "processed");
      const failed = m.sources.filter((s) => s.status === "failed");
      // Built from what was uploaded — a second run over changed sources gives a
      // different document, which is the whole point of the button.
      const minutes = deriveMinutes(m, processed);
      minutes.failedSources = failed.map((s) => s.name);
      m.minutes = minutes;

      stages[5].state = "done";
      stages[5].detail = fa(minutes.actions.length) + " اقدام، " + fa(minutes.decisions.length) + " تصمیم";
      m.job.status = "succeeded";
      m.status = failed.length && processed.length ? "partial_failure" : processed.length ? "ready" : "failed";
      if (!processed.length) { m.job.status = "failed"; m.job.error = "هیچ منبعی با موفقیت پردازش نشد؛ صورت‌جلسه‌ای تولید نشد."; m.minutes = null; }
      else bumpVersion(m, isRegeneration ? "regenerated" : "generated");
      toast(failed.length && processed.length ? "صورت‌جلسه با خطای جزئی تولید شد" : processed.length ? "صورت‌جلسه آماده است" : "پردازش ناموفق بود");
    },
  ];

  let i = 0;
  (function tick() {
    if (i >= steps.length) { render(); return; }
    steps[i++]();
    render();
    setTimeout(tick, 620);
  })();
}

/* ==========================================================================
   Boot
   ========================================================================== */
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && state.modal) { state.modal = null; render(); }
});

function seedAll() {
  state.meetings = seedMeetings();
  state.meetings.forEach((m) => { if (!m.kind) m.kind = "meeting_minutes"; });

  /* The first tab is not only for meetings, so the seeded list is not either. */
  state.meetings.push(
  { id: "e-letter", kind: "letter", title: "نامهٔ پیگیری اعتبار مطالعات امنیت",
    date: "2021-08-24", time: null, location: null,
    description: "پیگیری بی‌پاسخ ماندن نامهٔ ۱۲/۸۸۹۰",
    status: "uploaded", minutes: null, job: null, versions: [],
    sources: [{ id: "s-l1", name: "متن نامه.txt", type: "document", status: "uploaded",
      size: 1240, chars: 620,
      text: "پیرو نامهٔ ۱۲/۸۸۹۰ دربارهٔ تأمین اعتبار مطالعات تکمیلی امنیت تبادل داده، تا این تاریخ پاسخی از سازمان برنامه و بودجه دریافت نشده است. خواهشمند است نتیجهٔ بررسی اعلام شود." }] },
  { id: "e-note", kind: "note", title: "یادداشت شخصی دربارهٔ مرکز داده",
    date: "2021-09-06", time: null, location: null, description: null,
    status: "uploaded", minutes: null, job: null, versions: [],
    sources: [{ id: "s-n1", name: "یادداشت.txt", type: "document", status: "uploaded",
      size: 700, chars: 350,
      text: "ظرفیت فاز نخست مرکز داده ملی عملاً پر شده و برای اتصال دستگاه‌های جدید جا نیست. این برداشت شخصی است و باید با گزارش رسمی راستی‌آزمایی شود." }] },
  );

  /* The seeded meetings arrive already generated, so version 1 has to carry the
     document it produced — otherwise the first entry in the history is empty. */
  state.meetings.forEach((m) => {
    if (m.minutes && m.versions.length) m.versions[0].snapshot = snapshot(m.minutes);
  });

  seedDocMeta();
  seedSubmissions();
}

/* The webfont link is parked on media="print" so it cannot block this script.
   Promote it here rather than relying only on its inline onload, which some
   embedding contexts refuse to run. */
(function promoteFont() {
  const link = document.querySelector('link[rel="stylesheet"][media="print"]');
  if (link) link.media = "all";
})();

if (!loadState()) seedAll();
render();
