<style>
/* ==========================================================================
   Clickable prototype of the whole product: meeting minutes on one side,
   case tracking and the document archive on the other.
   Same interface as the real React app; all state lives in memory.
   ========================================================================== */
:root {
  --brand-50:#eef4fb; --brand-100:#d8e6f6; --brand-200:#b3cdec; --brand-300:#82abdd;
  --brand-400:#5386c9; --brand-500:#3467ae; --brand-600:#27528f; --brand-700:#1e3a5f;
  --s-50:#f8fafc; --s-100:#f1f5f9; --s-200:#e2e8f0; --s-300:#cbd5e1; --s-400:#94a3b8;
  --s-500:#64748b; --s-600:#475569; --s-700:#334155; --s-800:#1e293b; --s-900:#0f172a;
  --ok-50:#ecfdf5; --ok-200:#a7f3d0; --ok-700:#047857;
  --warn-50:#fffbeb; --warn-200:#fde68a; --warn-700:#b45309;
  --bad-50:#fef2f2; --bad-200:#fecaca; --bad-600:#dc2626; --bad-700:#b91c1c;
  --sky-50:#f0f9ff; --sky-200:#bae6fd; --sky-700:#0369a1;
  --card-shadow: 0 1px 2px rgba(15,23,42,.04), 0 8px 24px -12px rgba(15,23,42,.15);
  --font: "Vazirmatn", "Segoe UI", Tahoma, system-ui, sans-serif;
}

* { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  direction: rtl;
  background: var(--s-50);
  color: var(--s-900);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
}

/* Latin runs inside an RTL document need their own direction. */
.ltr { direction: ltr; unicode-bidi: isolate; text-align: left; }

h1,h2,h3,h4 { margin: 0; line-height: 1.3; }
p { margin: 0; }
button { font: inherit; }

:focus-visible { outline: 2px solid var(--brand-500); outline-offset: 2px; border-radius: 6px; }

::selection { background: var(--brand-200); color: var(--brand-700); }

.hidden { display: none !important; }

/* ---------- primitives ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .5rem;
  border-radius: 12px; font-weight: 500; font-size: .875rem;
  padding: .625rem 1rem; border: 1px solid transparent; cursor: pointer;
  transition: background-color .15s, border-color .15s, color .15s;
  white-space: nowrap;
}
.btn:disabled { opacity: .55; cursor: not-allowed; }
.btn-primary { background: var(--brand-600); color: #fff; }
.btn-primary:not(:disabled):hover { background: var(--brand-700); }
.btn-secondary { background: #fff; color: var(--s-700); border-color: var(--s-300); }
.btn-secondary:not(:disabled):hover { background: var(--s-50); }
.btn-ghost { background: transparent; color: var(--s-600); }
.btn-ghost:not(:disabled):hover { background: var(--s-100); }
.btn-danger { background: #fff; color: var(--bad-600); border-color: var(--bad-200); }
.btn-danger:not(:disabled):hover { background: var(--bad-50); }
.btn-sm { padding: .35rem .7rem; font-size: .8125rem; border-radius: 10px; }
.btn-lg { padding: .8rem 1.5rem; font-size: 1rem; }

.field {
  width: 100%; border-radius: 12px; border: 1px solid var(--s-300); background: #fff;
  padding: .625rem .875rem; font-size: .875rem; color: var(--s-900);
  outline: none; transition: border-color .15s, box-shadow .15s; font-family: inherit;
}
.field::placeholder { color: var(--s-400); }
.field:focus { border-color: var(--brand-500); box-shadow: 0 0 0 4px var(--brand-50); }
select.field { appearance: none; background-image: none; }
textarea.field { resize: vertical; min-height: 4.5rem; }

.label { display: block; font-size: .875rem; font-weight: 500; color: var(--s-700); margin-bottom: .375rem; }
.hint { font-size: .75rem; color: var(--s-500); margin-top: .25rem; }

.card {
  background: #fff; border: 1px solid var(--s-200); border-radius: 16px;
  box-shadow: var(--card-shadow); padding: 1.25rem;
}
@media (min-width: 640px) { .card { padding: 1.5rem; } }

.badge {
  display: inline-flex; align-items: center; gap: .35rem;
  border-radius: 999px; padding: .125rem .625rem; font-size: .75rem; font-weight: 500;
  border: 1px solid; white-space: nowrap;
}
.badge-neutral { background: var(--s-100); color: var(--s-600); border-color: var(--s-200); }
.badge-info    { background: var(--sky-50); color: var(--sky-700); border-color: var(--sky-200); }
.badge-success { background: var(--ok-50); color: var(--ok-700); border-color: var(--ok-200); }
.badge-warning { background: var(--warn-50); color: var(--warn-700); border-color: var(--warn-200); }
.badge-danger  { background: var(--bad-50); color: var(--bad-700); border-color: var(--bad-200); }
.badge-brand   { background: var(--brand-50); color: var(--brand-700); border-color: var(--brand-200); }
.badge .dot { width: 6px; height: 6px; border-radius: 999px; background: currentColor; }

@keyframes pulse-ring {
  0%   { box-shadow: 0 0 0 0 rgba(52,103,174,.35); }
  70%  { box-shadow: 0 0 0 8px rgba(52,103,174,0); }
  100% { box-shadow: 0 0 0 0 rgba(52,103,174,0); }
}
.pulse { animation: pulse-ring 1.8s cubic-bezier(.4,0,.6,1) infinite; }

.alert { border-radius: 12px; border: 1px solid; padding: .75rem 1rem; font-size: .875rem; }
.alert-danger  { background: var(--bad-50); border-color: var(--bad-200); color: #7f1d1d; }
.alert-warning { background: var(--warn-50); border-color: var(--warn-200); color: #78350f; }
.alert-info    { background: var(--sky-50); border-color: var(--sky-200); color: #0c4a6e; }

.section-title {
  display: flex; align-items: center; justify-content: space-between; gap: .75rem;
  margin-bottom: 1rem; flex-wrap: wrap;
}
.section-title h3 { font-size: 1rem; font-weight: 600; display: flex; align-items: center; gap: .5rem; }
.section-title .count {
  background: var(--s-100); color: var(--s-500); border-radius: 999px;
  padding: 0 .5rem; font-size: .75rem; font-weight: 400;
}

.stack { display: grid; gap: 1.5rem; }
.row { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; }
.spread { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
.muted { color: var(--s-500); }
.small { font-size: .8125rem; }
.tnum { font-variant-numeric: tabular-nums; }

/* ---------- app chrome ---------- */
.appbar {
  position: sticky; top: 0; z-index: 30;
  background: rgba(255,255,255,.88); backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--s-200);
}
.appbar-inner {
  max-width: 72rem; margin: 0 auto; padding: .75rem 1rem;
  display: flex; align-items: center; justify-content: space-between; gap: 1rem;
}
@media (min-width: 640px) { .appbar-inner { padding: .75rem 1.5rem; } }

.brand { display: flex; align-items: center; gap: .625rem; cursor: pointer; background: none; border: 0; padding: 0; }
.brand .mark {
  width: 32px; height: 32px; border-radius: 10px; background: var(--brand-600);
  display: grid; place-items: center; color: #fff; font-size: 1rem;
}
.brand .name { font-weight: 600; font-size: .95rem; color: var(--s-900); }

main.wrap { max-width: 72rem; margin: 0 auto; padding: 1.5rem 1rem 4rem; }
@media (min-width: 640px) { main.wrap { padding: 2rem 1.5rem 5rem; } }

/* ---------- landing ---------- */
.landing { background: #fff; min-height: 100vh; }
.landing-hero { position: relative; overflow: hidden; text-align: center; }
.landing-hero::before {
  content: ""; position: absolute; inset-inline: 0; top: -8rem; height: 20rem;
  background: linear-gradient(to bottom, var(--brand-50), transparent); pointer-events: none;
}
.landing-inner { position: relative; max-width: 48rem; margin: 0 auto; padding: 4rem 1.5rem 3.5rem; }
.eyebrow {
  display: inline-flex; align-items: center; gap: .5rem; border: 1px solid var(--brand-200);
  background: #fff; border-radius: 999px; padding: .25rem .75rem;
  font-size: .75rem; font-weight: 500; color: var(--brand-700); margin-bottom: 1rem;
}
.eyebrow .dot { width: 6px; height: 6px; border-radius: 999px; background: var(--brand-500); }
.landing h1 { font-size: clamp(1.75rem, 5vw, 3rem); font-weight: 700; line-height: 1.18; letter-spacing: -.01em; }
.landing .lede { margin: 1.25rem auto 0; max-width: 42rem; font-size: 1.0625rem; line-height: 1.9; color: var(--s-600); }
.landing .cta { display: flex; gap: .75rem; justify-content: center; flex-wrap: wrap; margin-top: 2rem; }

.landing-band { border-block: 1px solid var(--s-200); background: rgba(248,250,252,.7); }
.landing-band-inner { max-width: 56rem; margin: 0 auto; padding: 3.5rem 1.5rem; }
.band-title { text-align: center; font-size: .75rem; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--s-500); margin-bottom: 2.5rem; }

.flow-grid { display: grid; gap: 1rem; }
@media (min-width: 640px) { .flow-grid { grid-template-columns: 1fr 1fr; } }
.flow-item { display: flex; align-items: center; gap: 1rem; }
.flow-item .glyph { width: 48px; height: 48px; border-radius: 12px; background: var(--s-100); display: grid; place-items: center; font-size: 1.5rem; flex: none; }

.arrow { display: flex; justify-content: center; padding: 1.25rem 0; color: var(--s-300); }

.out-list { display: grid; gap: .625rem; margin-top: 1rem; }
@media (min-width: 640px) { .out-list { grid-template-columns: 1fr 1fr; } }
.out-list li { display: flex; align-items: center; gap: .625rem; font-size: .875rem; color: var(--s-700); }
.out-list .tick { width: 20px; height: 20px; border-radius: 999px; background: var(--ok-50); color: var(--ok-700); display: grid; place-items: center; font-size: .7rem; font-weight: 700; flex: none; }

.principles { max-width: 64rem; margin: 0 auto; padding: 4rem 1.5rem; }
.principles h2 { text-align: center; font-size: 1.5rem; font-weight: 700; }
.principles .sub { text-align: center; color: var(--s-600); margin: .5rem auto 2.5rem; max-width: 36rem; }
.principle-grid { display: grid; gap: 1rem; }
@media (min-width: 640px) { .principle-grid { grid-template-columns: 1fr 1fr; } }

.landing-close { border-top: 1px solid var(--s-200); background: var(--brand-700); color: #fff; text-align: center; }
.landing-close-inner { max-width: 48rem; margin: 0 auto; padding: 3.5rem 1.5rem; }
.landing-close h2 { font-size: 1.5rem; font-weight: 700; }
.landing-close p { color: var(--brand-100); margin-top: .75rem; }

.landing-footer { border-top: 1px solid var(--s-200); text-align: center; padding: 2rem 1rem; color: var(--s-500); font-size: .875rem; }

/* ---------- auth ---------- */
.auth-screen { min-height: 100vh; display: grid; place-items: center; padding: 2.5rem 1rem; background: var(--s-50); }
.auth-box { width: 100%; max-width: 26rem; }
.auth-brand { display: flex; align-items: center; justify-content: center; gap: .625rem; margin-bottom: 1.5rem; }

/* ---------- dashboard ---------- */
.table-wrap { overflow-x: auto; border-radius: 16px; }
table.meetings { width: 100%; border-collapse: collapse; font-size: .875rem; min-width: 40rem; }
table.meetings thead th {
  background: var(--s-50); text-align: right; font-weight: 500;
  font-size: .6875rem; letter-spacing: .05em; text-transform: uppercase; color: var(--s-500);
  padding: .75rem 1.25rem; white-space: nowrap;
}
table.meetings tbody td { padding: .875rem 1.25rem; border-top: 1px solid var(--s-100); }
table.meetings tbody tr { cursor: pointer; transition: background-color .12s; }
table.meetings tbody tr:hover { background: rgba(248,250,252,.7); }
table.meetings .title { font-weight: 500; color: var(--s-900); }
table.meetings tbody tr:hover .title { color: var(--brand-700); }

.mobile-cards { display: grid; gap: .75rem; }
@media (min-width: 768px) { .mobile-cards { display: none; } .table-wrap { display: block; } }
@media (max-width: 767px) { .table-wrap { display: none; } }

.empty {
  display: grid; place-items: center; text-align: center; gap: .25rem;
  border: 2px dashed var(--s-300); border-radius: 16px; padding: 3rem 1.5rem;
}
.empty .glyph { font-size: 2rem; margin-bottom: .5rem; }

/* ---------- sources ---------- */
.source-row {
  display: flex; align-items: center; gap: .75rem; flex-wrap: wrap;
  border: 1px solid var(--s-200); border-radius: 12px; padding: .75rem 1rem; background: #fff;
}
.source-row .glyph { font-size: 1.25rem; flex: none; }
.source-row .info { flex: 1 1 12rem; min-width: 0; }
.source-row .fname { font-size: .875rem; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.source-row .fmeta { font-size: .75rem; color: var(--s-500); margin-top: .125rem; }
.source-row .ferr { font-size: .75rem; color: var(--bad-600); margin-top: .375rem; }

.dropzone {
  display: grid; place-items: center; text-align: center; gap: .25rem;
  border: 2px dashed var(--s-300); border-radius: 16px; padding: 2.5rem 1.5rem;
  cursor: pointer; transition: border-color .15s, background-color .15s;
}
.dropzone:hover { border-color: var(--brand-400); background: rgba(238,244,251,.4); }
.dropzone.drag { border-color: var(--brand-500); background: var(--brand-50); }
.dropzone.disabled { cursor: not-allowed; opacity: .6; background: var(--s-50); }
.dropzone .glyph { font-size: 1.75rem; }

/* ---------- processing timeline ---------- */
.timeline { display: grid; }
.tl-item { display: flex; gap: .75rem; }
.tl-rail { display: flex; flex-direction: column; align-items: center; }
.tl-mark {
  width: 28px; height: 28px; border-radius: 999px; border: 1px solid var(--s-200);
  display: grid; place-items: center; font-size: .75rem; color: var(--s-300);
  background: #fff; flex: none; transition: all .2s;
}
.tl-line { width: 1px; flex: 1; min-height: 14px; background: var(--s-200); }
.tl-item:last-child .tl-line { display: none; }
.tl-text { padding: .25rem 0 .875rem; }
.tl-label { font-size: .875rem; color: var(--s-400); }
.tl-detail { font-size: .75rem; color: var(--s-500); margin-top: .125rem; }

.tl-item[data-state="running"] .tl-mark { color: var(--brand-600); border-color: var(--brand-300); background: var(--brand-50); }
.tl-item[data-state="running"] .tl-label { color: var(--s-900); font-weight: 500; }
.tl-item[data-state="done"] .tl-mark { color: var(--ok-700); border-color: var(--ok-200); background: var(--ok-50); }
.tl-item[data-state="done"] .tl-label { color: var(--s-700); }
.tl-item[data-state="done"] .tl-line { background: var(--ok-200); }
.tl-item[data-state="failed"] .tl-mark { color: var(--bad-600); border-color: var(--bad-200); background: var(--bad-50); }
.tl-item[data-state="failed"] .tl-label { color: var(--bad-700); font-weight: 500; }
.tl-item[data-state="skipped"] .tl-label { color: var(--s-400); }

/* ---------- minutes ---------- */
.minutes-head { display: flex; align-items: center; justify-content: space-between; gap: .75rem; flex-wrap: wrap; }
.minutes-head h2 { font-size: 1.125rem; font-weight: 600; }

.kv { display: flex; flex-wrap: wrap; gap: .25rem 1.25rem; font-size: .875rem; color: var(--s-600); margin-top: .5rem; }
.kv > div { display: flex; gap: .375rem; }
.kv dt { color: var(--s-500); }
.kv dd { margin: 0; }

.people { display: flex; flex-wrap: wrap; gap: .5rem; }
.person { border: 1px solid var(--s-200); border-radius: 10px; padding: .375rem .75rem; font-size: .875rem; }
.person .role { color: var(--s-500); font-size: .75rem; margin-inline-start: .375rem; }

.decision-item { border: 1px solid var(--s-200); border-radius: 12px; padding: 1rem; }
.decision-item .txt { line-height: 1.8; }
.decision-item .num { color: var(--s-400); margin-inline-end: .375rem; }

.proposal-item {
  border: 1px solid var(--warn-200); background: rgba(255,251,235,.5);
  border-radius: 12px; padding: .75rem 1rem; font-size: .875rem; line-height: 1.8;
  display: flex; justify-content: space-between; gap: .75rem; align-items: flex-start; flex-wrap: wrap;
}

.action-card { border: 1px solid var(--s-200); border-radius: 12px; padding: 1rem; background: #fff; transition: border-color .15s; }
.action-card:hover { border-color: var(--s-300); }
.action-card.editing { border-color: var(--brand-300); background: rgba(238,244,251,.35); }
.action-card .atitle { font-weight: 500; line-height: 1.8; }
.action-card .adesc { font-size: .875rem; color: var(--s-600); margin-top: .375rem; line-height: 1.8; }
.action-foot {
  display: flex; align-items: center; justify-content: space-between; gap: .5rem;
  border-top: 1px solid var(--s-100); padding-top: .625rem; margin-top: .75rem; flex-wrap: wrap;
}
.linkish {
  background: none; border: 0; padding: .125rem; cursor: pointer;
  font-size: .75rem; color: var(--s-400); text-decoration: underline;
  text-underline-offset: 2px; text-decoration-color: var(--s-300);
}
.linkish:hover { color: var(--brand-600); text-decoration-color: currentColor; }

.bullet-list { display: grid; gap: .5rem; }
.bullet-list li { display: flex; gap: .5rem; font-size: .875rem; line-height: 1.8; color: var(--s-700); }
.bullet-list .b { color: var(--s-300); flex: none; }

.topic + .topic { margin-top: 1.25rem; }
.topic .tname { font-weight: 500; }
.topic .tsum { font-size: .875rem; color: var(--s-600); line-height: 1.8; margin-top: .25rem; }

/* ---------- modal ---------- */
.overlay {
  position: fixed; inset: 0; z-index: 50; background: rgba(15,23,42,.45);
  backdrop-filter: blur(4px); display: flex; align-items: flex-start; justify-content: center;
  padding: 1rem; overflow-y: auto;
}
@media (min-width: 640px) { .overlay { padding: 2rem; } }
.modal { background: #fff; border-radius: 16px; box-shadow: var(--card-shadow); width: 100%; max-width: 32rem; margin: auto; padding: 1.25rem; }
@media (min-width: 640px) { .modal { padding: 1.5rem; } }
.modal.wide { max-width: 48rem; }
.modal-head { display: flex; align-items: center; justify-content: space-between; gap: .75rem; margin-bottom: 1rem; }
.modal-head h3 { font-size: 1rem; font-weight: 600; }
.icon-btn { background: none; border: 0; padding: .375rem; border-radius: 8px; cursor: pointer; color: var(--s-400); line-height: 0; }
.icon-btn:hover { background: var(--s-100); color: var(--s-600); }

.evidence-item { border: 1px solid var(--s-200); border-radius: 12px; padding: .875rem; }
.evidence-item .src { display: flex; align-items: center; gap: .5rem; font-weight: 500; font-size: .875rem; }
.evidence-item blockquote {
  margin: .5rem 0 0; border-inline-start: 2px solid var(--brand-300);
  padding-inline-start: .75rem; font-size: .875rem; line-height: 1.8; color: var(--s-600);
}

.transcript { max-height: 60vh; overflow-y: auto; background: var(--s-50); border-radius: 12px; padding: 1rem; }
.transcript p { font-size: .875rem; line-height: 1.9; color: var(--s-700); }
.transcript p + p { margin-top: .5rem; }
.ts { display: inline-block; background: #fff; border-radius: 4px; padding: 0 .375rem; font-size: .6875rem; color: var(--s-400); margin-inline-end: .5rem; }

/* speaker separation */
.turn + .turn { margin-top: .875rem; }
.turn-head { display: flex; align-items: center; gap: .5rem; margin-bottom: .125rem; }
.spk-chip { border-radius: 4px; padding: .0625rem .375rem; font-size: .75rem; font-weight: 500; color: var(--spk); background: var(--spk-bg); }
.spk-dot { width: .625rem; height: .625rem; border-radius: 999px; flex-shrink: 0; background: var(--spk); }
.spk-panel { border: 1px solid var(--s-200); border-radius: 12px; padding: 1rem; margin-bottom: 1rem; }
.spk-row { display: flex; align-items: center; gap: .75rem; }
.spk-row + .spk-row { margin-top: .5rem; }
.spk-row input { flex: 1; min-width: 0; }
.spk-stat { width: 8rem; flex-shrink: 0; text-align: left; font-size: .75rem; color: var(--s-400); }
.spk-1 { --spk: #4f46e5; --spk-bg: #eef2ff; }
.spk-2 { --spk: #059669; --spk-bg: #ecfdf5; }
.spk-3 { --spk: #d97706; --spk-bg: #fffbeb; }
.spk-4 { --spk: #7c3aed; --spk-bg: #f5f3ff; }
.spk-5 { --spk: #e11d48; --spk-bg: #fff1f2; }
.spk-6 { --spk: #0284c7; --spk-bg: #f0f9ff; }

.version-row { display: flex; align-items: center; justify-content: space-between; gap: .75rem; border: 1px solid var(--s-200); border-radius: 12px; padding: .75rem 1rem; }

/* document preview inside the export modal */
.docpreview { background: #fff; border: 1px solid var(--s-200); border-radius: 8px; padding: 1.75rem; max-height: 60vh; overflow-y: auto; }
.docpreview h1 { text-align: center; font-size: 1.375rem; color: var(--brand-700); }

function finishedJob(sources, minutes, failed) {

  const badDocs = docs.length - okDocs;
  return {

    stages: STAGE_DEFS.map((d) => {
      let detail = null, state = "done";
      if (d.key === "upload") detail = fa(sources.length) + " فایل";
      if (d.key === "extract_documents") {
        if (!docs.length) { state = "skipped"; detail = "سند متنی وجود ندارد"; }
        else detail = badDocs ? fa(okDocs) + " موفق، " + fa(badDocs) + " ناموفق" : fa(okDocs) + " مورد";
      }
      if (d.key === "transcribe_audio") {
        if (!auds.length) { state = "skipped"; detail = "فایل صوتی وجود ندارد"; }
        else detail = fa(auds.length) + " مورد";
      }
      if (d.key === "analyze_sources") detail = fa(sources.filter((s) => s.status === "processed").length) + " منبع تحلیل شد";
      if (d.key === "consolidate") detail = "بدون هشدار";
      if (d.key === "generate_minutes" && minutes)
        detail = fa(minutes.actions.length) + " اقدام، " + fa(minutes.decisions.length) + " تصمیم";
      return { key: d.key, label: d.label, state: state, detail: detail };
    }),
    error: null,
    isRegeneration: false,
  };
}

/* ==========================================================================
   Helpers
   ========================================================================== */
const FA_DIGITS = ["۰","۱","۲","۳","۴","۵","۶","۷","۸","۹"];
function fa(v) { return String(v).replace(/[0-9]/g, (d) => FA_DIGITS[+d]); }

function esc(v) {
  return String(v == null ? "" : v)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

/* Gregorian → Jalali. Written out rather than left to Intl so the file keeps
   working offline, in an old browser, and identically on every machine that
   opens it during a presentation. */
const JMONTHS = ["فروردین","اردیبهشت","خرداد","تیر","مرداد","شهریور",
                 "مهر","آبان","آذر","دی","بهمن","اسفند"];

function toJalali(gy, gm, gd) {
  const gdm = [0,31,59,90,120,151,181,212,243,273,304,334];
  let jy = gy <= 1600 ? 0 : 979;
  const gy2 = gy <= 1600 ? gy - 621 : gy - 1600;
  const gm2 = gm > 2 ? 1 : 0;
  let days = 365 * gy2 + Math.floor((gy2 + 3) / 4) - Math.floor((gy2 + 99) / 100)
    + Math.floor((gy2 + 399) / 400) - 80 + gd + gdm[gm - 1] + gm2 * leapG(gy);
  jy += 33 * Math.floor(days / 12053);
  days %= 12053;
  jy += 4 * Math.floor(days / 1461);
  days %= 1461;
  if (days > 365) { jy += Math.floor((days - 1) / 365); days = (days - 1) % 365; }
  const jm = days < 186 ? 1 + Math.floor(days / 31) : 7 + Math.floor((days - 186) / 30);
  const jd = 1 + (days < 186 ? days % 31 : (days - 186) % 30);
  return [jy, jm, jd];
}
function leapG(y) { return (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0 ? 1 : 0; }

const pad2 = (v) => (v < 10 ? "0" + v : String(v));

/* The numeric form the archive already uses, so one file reads as one file. */
function formatDate(iso) {
  if (!iso) return "مشخص نشده";
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso);
  if (!m) return iso;
  const [jy, jm, jd] = toJalali(+m[1], +m[2], +m[3]);
  return fa(jy + "/" + pad2(jm) + "/" + pad2(jd));
}
/* The long form, for a document header where the date is read, not scanned. */
function formatDateLong(iso) {
  if (!iso) return "مشخص نشده";
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso);
  if (!m) return iso;
  const [jy, jm, jd] = toJalali(+m[1], +m[2], +m[3]);
  return fa(jd) + " " + JMONTHS[jm - 1] + " " + fa(jy);
}
function todayIso() {
  const d = new Date();
  return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
}
function formatBytes(b) {
  if (b < 1024) return fa(b) + " بایت";
  if (b < 1048576) return fa((b / 1024).toFixed(0)) + " کیلوبایت";
  return fa((b / 1048576).toFixed(1)) + " مگابایت";
}
function formatDuration(sec) {
  if (!sec) return null;
  const m = Math.floor(sec / 60);
  return fa(m) + " دقیقه";
}

// A diarization label identifies a voice, not a person. Until someone says
// whose voice it is, this is all we are entitled to call them.
function fallbackSpeaker(label) {
  return "گویندهٔ " + fa(label.replace("speaker_", ""));
}

function speakerLabel(source, label) {
  const given = source.speakerNames && source.speakerNames[label];
  return (given || "").trim() || fallbackSpeaker(label);
}

/* The transcript as text, carrying whatever names have been assigned. This is
   what the archive searches and what a quote is taken from, so naming a voice
   has to rewrite it. */
function speakerText(source) {
  if (!source.turns || !source.turns.length) return source.text || "";
  return source.turns.map((t) => speakerLabel(source, t.speaker) + ": " + t.text).join("\n\n");
}

function speakerStats(source) {
  const order = [];
  const totals = {};
  source.turns.forEach((t) => {
    if (!totals[t.speaker]) { order.push(t.speaker); totals[t.speaker] = { count: 0, chars: 0 }; }
    totals[t.speaker].count += 1;
    totals[t.speaker].chars += t.text.length;
  });
  const allChars = source.turns.reduce((n, t) => n + t.text.length, 0) || 1;
  return order.map((label) => ({
    label,
    count: totals[label].count,
    seconds: Math.round((source.duration || 0) * totals[label].chars / allChars),
  }));
}

function extOf(name) { const p = name.split("."); return p.length > 1 ? p.pop().toLowerCase() : ""; }
function deadlineLabel(a) {
  if (a.deadline) return { text: formatDate(a.deadline), exact: true };
  if (a.deadlineText) return { text: a.deadlineText, exact: false };
  return { text: "مشخص نشده", exact: false };
}

}
function snapshot(minutes) {
  return minutes ? JSON.parse(JSON.stringify(minutes)) : null;
}

/* A version is only worth keeping if it keeps the text. Storing the document
   alongside the row is what lets "نسخهٔ ۱" actually show version 1 — without
   it the history is a list of dates that all open the same page. */
function bumpVersion(m, origin) {
  const last = m.versions[m.versions.length - 1];
  // A run of edits in one sitting stays one revision, but that revision has to
  // carry the document as it looks now, not as it looked when the run started.
  if (origin === "user_edit" && last && last.origin === "user_edit") {
    last.at = new Date().toISOString();
    last.snapshot = snapshot(m.minutes);
    return;
  }
  m.versions.push({
    n: m.versions.length + 1, origin: origin,
    at: new Date().toISOString(), snapshot: snapshot(m.minutes),
  });
}

/* ==========================================================================
   Keeping the session

   A prototype that forgets everything on refresh is a prototype nobody can
   show twice. Everything the two tabs hold is small and plain, so it goes
   straight to localStorage; the modal never does, because a confirm dialog
   carries a callback and a callback is not data.
   ========================================================================== */
const STORE_KEY = "astan-prototype-v1";

function saveState() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify({
      uid: uid, user: state.user, route: state.route, role: state.role,
      meetings: state.meetings, docMeta: state.docMeta, chat: state.chat,
      submissions: state.submissions,
      archive: ARCHIVE, docTab: state.docTab,
      archiveQuery: state.archiveQuery, archiveKind: state.archiveKind,
      archiveFrom: state.archiveFrom, archiveTo: state.archiveTo,
    }));
  } catch (e) { /* private window, or the quota is full — the demo still runs */ }
}

function loadState() {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(STORE_KEY) || "null"); } catch (e) { return false; }
  if (!saved || !Array.isArray(saved.meetings)) return false;

  uid = saved.uid || uid;
  state.user = saved.user || null;
  state.role = ROLES[saved.role] ? saved.role : "manager";
  state.meetings = saved.meetings;
  state.docMeta = saved.docMeta || {};
  state.chat = saved.chat || {};
  state.submissions = saved.submissions || [];
  state.docTab = saved.docTab || "comments";
  ["archiveQuery", "archiveKind", "archiveFrom", "archiveTo"].forEach((k) => { state[k] = saved[k] || ""; });
  if (Array.isArray(saved.archive)) { ARCHIVE.length = 0; saved.archive.forEach((d) => ARCHIVE.push(d)); }

  // A job that was mid-flight when the tab closed has no timer behind it any
  // more; leaving it "processing" would freeze that entry for good.
  state.meetings.forEach((m) => {
    if (m.status !== "processing") return;
    m.status = m.minutes ? "ready" : m.sources.length ? "uploaded" : "draft";
    if (m.job) m.job.status = m.minutes ? "succeeded" : "failed";
  });

  const r = saved.route;
  state.route = r && r.name ? r : { name: state.user ? "dashboard" : "landing" };
  if (state.route.name === "meeting" && !state.meetings.some((m) => m.id === state.route.id)) state.route = { name: "dashboard" };
  if (state.route.name === "case" && !CASE_LIST.some((c) => c.id === state.route.id)) state.route = { name: "cases" };
  return true;
}

function resetDemo() {
  try { localStorage.removeItem(STORE_KEY); } catch (e) { /* nothing to clear */ }
  location.reload();
}

  if (r.name === "landing") html = viewLanding();

  else if (r.name === "new") html = shell(viewNewMeeting());
  else if (r.name === "meeting") html = shell(viewMeeting());
  else if (r.name === "cases") html = shell(viewCases());
  else if (r.name === "case") html = shell(viewCase());
  else if (r.name === "inbox") html = shell(viewInbox());
  else if (r.name === "archive") html = shell(viewArchive());
  else html = shell("<p>صفحه پیدا نشد.</p>");

  if (state.modal) html += viewModal();
  root.innerHTML = html;
  wire();
  saveState();
}

          <button class="btn btn-primary btn-lg" data-auth="register">شروع یک جلسه</button>
          <button class="btn btn-secondary btn-lg" data-auth="login">قبلاً حساب دارم</button>
        </div>
      </div>
    </section>

    <section class="landing-band">
      <div class="landing-band-inner">
        <p class="band-title">چطور کار می‌کند</p>
        <div class="flow-grid">
          <div class="card flow-item"><span class="glyph">🎙</span><div><p style="font-weight:500">فایل صوتی جلسه</p><p class="muted small">MP3، WAV، M4A یا MP4</p></div></div>
          <div class="card flow-item"><span class="glyph">📄</span><div><p style="font-weight:500">اسناد جلسه</p><p class="muted small">PDF، Word، متن و Markdown</p></div></div>
        </div>
        <div class="arrow">${arrowSvg()}</div>
        <div class="card" style="max-width:28rem;margin:0 auto;text-align:center">
          <p style="font-weight:600;color:var(--brand-700)">تحلیل هوش مصنوعی</p>
          <p class="muted small" style="margin-top:.25rem">پیاده‌سازی صوت، استخراج متن اسناد و یکپارچه‌سازی همهٔ منابع</p>
        </div>
        <div class="arrow">${arrowSvg()}</div>
        <div class="card" style="max-width:36rem;margin:0 auto">
          <p style="font-weight:600;text-align:center">📝 صورت‌جلسهٔ نهایی</p>
          <ul class="out-list" style="list-style:none;padding:0">
            ${["تصمیمات","اقدامات و مسئولان","مهلت‌ها","پرسش‌های باز"].map((t) =>
              `<li><span class="tick">✓</span>${t}</li>`).join("")}
          </ul>
          <p class="muted small" style="text-align:center;border-top:1px solid var(--s-100);margin-top:1.25rem;padding-top:1rem">قابل ویرایش · خروجی Word و PDF</p>
        </div>
      </div>
    </section>

    <section class="principles">
      <h2>چرا می‌توان به این صورت‌جلسه اعتماد کرد</h2>
      <p class="sub">این ابزار فقط خلاصه‌نویسی نمی‌کند؛ سندی می‌سازد که می‌توانید بر اساس آن تصمیم بگیرید.</p>
      <div class="principle-grid">
        ${[
          ["هیچ چیز از خودش نمی‌سازد","اگر نام، تاریخ یا مسئولی در منابع نباشد، سیستم آن را «مشخص نشده» گزارش می‌کند؛ حدس نمی‌زند."],
          ["اطلاعات منابع را یکپارچه می‌کند","اگر یک اقدام هم در فایل صوتی و هم در یادداشت‌ها آمده باشد، یک بار ثبت می‌شود — نه دو بار."],
          ["قطعیت را مشخص می‌کند","«شاید هفته آینده منتشر کنیم» تصمیم نیست؛ به عنوان پیشنهاد ثبت می‌شود."],
          ["منبع هر نکته قابل ردیابی است","برای هر تصمیم و اقدام می‌توانید ببینید از کدام فایل استخراج شده است."],
        ].map(([t, d]) => `<div class="card"><p style="font-weight:600">${t}</p><p class="muted small" style="margin-top:.5rem;line-height:1.9">${d}</p></div>`).join("")}
      </div>
    </section>

    <section class="landing-close">
      <div class="landing-close-inner">
        <h2>آمادهٔ شروع هستید؟</h2>
        <p>اولین جلسهٔ خود را بسازید و ببینید نتیجه چطور از آب درمی‌آید.</p>
        <button class="btn btn-secondary btn-lg" style="margin-top:1.75rem" data-auth="register">شروع یک جلسه</button>
      </div>
    </section>

    <footer class="landing-footer">دستیار صورت‌جلسه — نسخهٔ نمایشی</footer>
  </div>`;
}

function arrowSvg() {
  return `<svg viewBox="0 0 24 40" width="24" height="40" fill="none" aria-hidden="true"><path d="M12 2v30m0 0-7-7m7 7 7-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

          هرچه وارد می‌کنید به بایگانی اضافه می‌شود و از همان لحظه در جست‌وجوی پرونده‌ها دیده می‌شود.

        <span class="glyph">📥</span>
        <p style="font-weight:500">هنوز داده‌ای وارد نکرده‌اید</p>
        <p class="muted small" style="max-width:28rem">عنوان، تاریخ و نوع را وارد کنید و بعد فایل صوتی، فایل سند یا متن آن را بدهید.</p>
        <button class="btn btn-primary" style="margin-top:1rem" data-go="new">ورود اولین داده</button>

            ${rows.map((m) => {

                <td class="title">${esc(m.title)}</td>
                <td class="muted">${k.glyph} ${k.label}</td>
                <td class="muted tnum">${m.date ? formatDate(m.date) : "—"}</td>
              </tr>`;
            }).join("")}
          </tbody>
        </table>
      </div>
      <div class="mobile-cards">
        ${rows.map((m) => {
          const k = DOC_KINDS[m.kind || "meeting_minutes"];
          return `

            <p style="font-weight:500">${esc(m.title)}</p>
            <p class="muted small tnum" style="margin-top:.5rem">${k.glyph} ${k.label} · ${m.date ? formatDate(m.date) : "بدون تاریخ"}</p>

/* ---------- meeting workspace ---------- */
function viewMeeting() {
  const m = currentMeeting();
  if (!m) return `<div class="empty"><span class="glyph">🔍</span><p style="font-weight:500">این جلسه پیدا نشد</p></div>`;

  const processing = m.status === "processing";
  const hasSources = m.sources.length > 0;

  return `
    <div class="stack">
      <div>
        <button class="linkish" style="font-size:.875rem;text-decoration:none;color:var(--s-500)" data-go="dashboard">← فهرست ورود دیتا</button>
        <div class="spread" style="margin-top:.5rem">
          <div>
            <h1 style="font-size:1.5rem;font-weight:600">${esc(m.title)}</h1>
            <p class="muted small tnum" style="margin-top:.25rem">
              ${DOC_KINDS[m.kind || "meeting_minutes"].label} · ${m.date ? formatDate(m.date) : "بدون تاریخ"}${m.time ? " · " + esc(m.time) : ""}${m.location ? " · " + esc(m.location) : ""}
            </p>
            ${m.description ? `<p class="muted small" style="margin-top:.35rem;max-width:46rem">${esc(m.description)}</p>` : ""}
          </div>
          <div class="row">
            ${can("removeRecord") ? `<button class="btn btn-ghost btn-sm" style="color:var(--bad-600)" data-delete-meeting="${m.id}">حذف</button>` : ""}
          </div>
        </div>
      </div>

      ${m.status === "failed" ? `<div class="alert alert-danger">آخرین پردازش ناموفق بود: ${esc(m.job && m.job.error || "خطای نامشخص")}</div>` : ""}

      <div class="card">
        <div class="section-title"><h3>محتوای این ورودی <span class="count">${fa(m.sources.length)}</span></h3></div>
        <div class="stack" style="gap:1rem">
          ${m.sources.length ? `<div style="display:grid;gap:.5rem">${m.sources.map((s) => sourceRow(s, processing)).join("")}</div>` : ""}
          <div class="dropzone ${processing ? "disabled" : ""} ${state.dragging ? "drag" : ""}" data-drop tabindex="0" role="button">
            <span class="glyph">📎</span>
            <p style="font-weight:500;color:var(--s-800)">فایل‌های جلسه را اینجا رها کنید</p>
            <p class="muted small">یا برای انتخاب کلیک کنید</p>
            <p class="muted" style="font-size:.75rem;margin-top:.5rem">صوت: MP3، WAV، M4A، MP4 — اسناد: PDF، Word، متن، Markdown · حداکثر ۲۰۰ مگابایت</p>
            <input type="file" id="file-input" multiple hidden>
          </div>
          <div>
            <label class="label" for="text-in">یا متن سند را مستقیم بنویسید</label>
            <textarea class="field" id="text-in" rows="4" placeholder="متن نامه، مصوبه، یادداشت یا گزارش را اینجا وارد کنید…"></textarea>
            <div class="row" style="margin-top:.5rem">
              <button class="btn btn-secondary btn-sm" data-add-text>افزودن این متن</button>
              <span class="muted small">متن وارد‌شده مثل یک فایل، منبع این ورودی می‌شود.</span>
            </div>
          </div>
        </div>
        <div class="row" style="border-top:1px solid var(--s-100);margin-top:1.25rem;padding-top:1.25rem">
          ${!m.minutes ? `
            <button class="btn btn-primary" data-process ${!hasSources || processing ? "disabled" : ""}>
              ${processing ? "در حال پردازش…" : "شروع پردازش"}
            </button>
            ${!hasSources ? `<p class="muted small">برای شروع پردازش حداقل یک فایل بارگذاری کنید.</p>` : ""}
          ` : `<p class="muted small">پس از افزودن یا حذف منابع، صورت‌جلسه را دوباره تولید کنید.</p>`}
        </div>
      </div>

      ${m.job ? `
        <div class="card">
          <div class="section-title"><h3>وضعیت پردازش</h3>${m.job.isRegeneration ? `<span class="badge badge-brand">تولید مجدد</span>` : ""}</div>
          <p class="small" style="font-weight:500;color:var(--s-700);margin-bottom:1rem">
            ${m.job.status === "running" ? "در حال پردازش…" : m.job.status === "succeeded" ? "پردازش کامل شد" : m.job.status === "failed" ? "پردازش ناموفق بود" : "در صف پردازش"}
          </p>
          <div class="timeline">${m.job.stages.map(stageRow).join("")}</div>
          ${m.job.error ? `<div class="alert alert-danger" style="margin-top:1rem">${esc(m.job.error)}</div>` : ""}
        </div>` : ""}

      ${m.minutes ? minutesSection(m) : (hasSources && !m.job ? `
        <div class="empty">
          <span class="glyph">✨</span>
          <p style="font-weight:500">آمادهٔ پردازش</p>
          <p class="muted small" style="max-width:32rem">با شروع پردازش، فایل صوتی پیاده‌سازی و متن اسناد استخراج می‌شود، سپس صورت‌جلسه تولید می‌گردد.</p>
        </div>` : "")}
    </div>`;
}

function sourceRow(s, processing) {
  const st = SOURCE_STATUS[s.status];
  const bits = [formatBytes(s.size)];
  if (s.chars) bits.push(fa(s.chars) + " کاراکتر متن");
  if (s.duration) bits.push(formatDuration(s.duration));
  return `
    <div class="source-row">
      <span class="glyph">${s.type === "audio" ? "🎙" : "📄"}</span>
      <div class="info">
        <p class="fname ltr">${esc(s.name)}</p>
        <p class="fmeta tnum">${bits.join(" · ")}</p>
        ${s.error ? `<p class="ferr">${esc(s.error)} <button class="btn btn-secondary btn-sm" style="margin-inline-start:.5rem;padding:.1rem .5rem" data-retry>تلاش دوباره</button></p>` : ""}
      </div>
      <span class="badge badge-${st.tone}">${s.status === "processing" ? `<span class="dot pulse"></span>` : ""}${st.label}</span>
      ${s.simulated ? `<span class="badge badge-warning" title="در این نسخهٔ نمایشی متن این فایل استخراج نشده و متن نمونه جایگزین آن شده است">متن نمونه</span>` : ""}
      <div class="row" style="gap:.25rem">
        ${s.text ? `<button class="btn btn-ghost btn-sm" data-view-source="${s.id}">مشاهدهٔ متن</button>` : ""}
        <button class="btn btn-ghost btn-sm" data-download-source="${esc(s.name)}">دانلود</button>
        ${processing || !can("removeRecord") ? "" : `<button class="btn btn-ghost btn-sm" style="color:var(--bad-600)" data-remove-source="${s.id}">حذف</button>`}
      </div>
    </div>`;
}

function stageRow(st) {
  const glyph = { pending: "○", running: "●", done: "✓", failed: "✕", skipped: "–" }[st.state] || "○";
  return `
    <div class="tl-item" data-state="${st.state}">
      <div class="tl-rail"><span class="tl-mark ${st.state === "running" ? "pulse" : ""}">${glyph}</span><span class="tl-line"></span></div>
      <div class="tl-text">
        <p class="tl-label">${st.label}</p>
        ${st.detail ? `<p class="tl-detail tnum">${esc(st.detail)}</p>` : ""}
      </div>
    </div>`;
}

/* ---------- minutes ---------- */
function minutesSection(m) {
  const d = m.minutes;
  const version = m.versions[m.versions.length - 1];
  return `
    <div class="minutes-head">
      <h2>صورت‌جلسه</h2>
      <div class="row" style="gap:.5rem">
        ${can("submit") ? `<button class="btn btn-primary btn-sm" data-submit-minutes="${m.id}">ارسال برای تأیید مدیر</button>` : ""}
        <button class="btn btn-secondary btn-sm" data-regenerate ${m.status === "processing" ? "disabled" : ""}>تولید مجدد</button>
        ${m.versions.length > 1 ? `<button class="btn btn-ghost btn-sm" data-versions>تاریخچهٔ نسخه‌ها (${fa(m.versions.length)})</button>` : ""}
        <button class="btn btn-secondary btn-sm" data-export="docx">دانلود Word</button>
        <button class="btn btn-secondary btn-sm" data-export="pdf">دانلود PDF</button>
        <button class="btn btn-ghost btn-sm" data-export="md">Markdown</button>
      </div>
    </div>

    ${d.simulatedSources && d.simulatedSources.length ? `<div class="alert alert-info">
      این صورت‌جلسه از متن این فایل‌ها ساخته شده، اما متن آن‌ها در نسخهٔ نمایشی استخراج نشد و متن نمونه جایگزین شد:
      <span class="ltr" style="display:inline-block">${d.simulatedSources.map(esc).join("، ")}</span>.
      فایل‌های متنی (TXT و Markdown) همین‌جا واقعاً خوانده می‌شوند.
    </div>` : ""}

    ${d.failedSources.length ? `<div class="alert alert-warning">این صورت‌جلسه بر پایهٔ منابع موفق تهیه شده است. فایل‌های زیر پردازش نشدند: <span class="ltr" style="display:inline-block">${d.failedSources.map(esc).join("، ")}</span></div>` : ""}

    <div class="card">
      ${state.editingTitle ? `
        <div style="display:grid;gap:.75rem">
          <div><label class="label" for="ed-title">عنوان صورت‌جلسه</label><input class="field" id="ed-title" value="${esc(d.title)}"></div>
          <div class="row"><button class="btn btn-primary btn-sm" data-save-title>ذخیره</button><button class="btn btn-secondary btn-sm" data-cancel-edit>انصراف</button></div>
        </div>` : `
        <div class="spread">
          <div>
            <h2 style="font-size:1.25rem;font-weight:600">${esc(d.title)}</h2>
            <dl class="kv">
              ${d.info.date ? `<div><dt>تاریخ:</dt><dd class="tnum">${formatDate(d.info.date)}</dd></div>` : ""}
              ${d.info.time ? `<div><dt>ساعت:</dt><dd class="tnum">${esc(d.info.time)}</dd></div>` : ""}
              ${d.info.location ? `<div><dt>محل برگزاری:</dt><dd>${esc(d.info.location)}</dd></div>` : ""}
            </dl>
          </div>
          <button class="btn btn-ghost btn-sm" data-edit-title>ویرایش</button>
        </div>`}
      ${d.info.objective ? `
        <div style="border-top:1px solid var(--s-100);margin-top:1rem;padding-top:1rem">
          <p class="muted" style="font-size:.6875rem;letter-spacing:.06em;text-transform:uppercase;font-weight:500">هدف جلسه</p>
          <p class="small" style="margin-top:.25rem;color:var(--s-700);line-height:1.9">${esc(d.info.objective)}</p>
        </div>` : ""}
    </div>

    <div class="card">
      <div class="section-title">
        <h3>خلاصهٔ اجرایی</h3>
        ${state.editingSummary ? "" : `<button class="btn btn-ghost btn-sm" data-edit-summary>ویرایش</button>`}
      </div>
      ${state.editingSummary ? `
        <div style="display:grid;gap:.75rem">
          <textarea class="field" id="ed-summary" rows="5">${esc(d.summary)}</textarea>
          <div class="row"><button class="btn btn-primary btn-sm" data-save-summary>ذخیره</button><button class="btn btn-secondary btn-sm" data-cancel-edit>انصراف</button></div>
        </div>` : `<p style="line-height:2;color:var(--s-700);font-size:.9375rem">${esc(d.summary)}</p>`}
    </div>

    ${d.participants.length || d.absentees.length ? `
      <div class="card">
        <div class="section-title"><h3>شرکت‌کنندگان <span class="count">${fa(d.participants.length)}</span></h3></div>
        <div class="people">${d.participants.map((p) => `<span class="person">${esc(p.name)}${p.role ? `<span class="role">${esc(p.role)}</span>` : ""}</span>`).join("")}</div>
        ${d.absentees.length ? `<p class="muted small" style="margin-top:.75rem">غایبان: ${d.absentees.map((p) => esc(p.name)).join("، ")}</p>` : ""}
      </div>` : ""}

    ${d.decisions.length ? `
      <div class="card">
        <div class="section-title"><h3>تصمیمات <span class="count">${fa(d.decisions.length)}</span></h3></div>
        <div style="display:grid;gap:.75rem">${d.decisions.map((dec, i) => decisionCard(dec, i)).join("")}</div>
      </div>` : ""}

    ${d.proposals.length ? `
      <div class="card">
        <div class="section-title"><h3>پیشنهادهای مطرح‌شده <span class="count">${fa(d.proposals.length)}</span></h3></div>
        <p class="muted small" style="margin:-.5rem 0 .75rem">این موارد مطرح شده‌اند اما به تصمیم قطعی نرسیده‌اند.</p>
        <div style="display:grid;gap:.5rem">
          ${d.proposals.map((p) => `
            <div class="proposal-item">
              <span>${esc(p.text)}${p.context ? `<br><span class="muted" style="font-size:.75rem">${esc(p.context)}</span>` : ""}</span>
              <button class="linkish" data-evidence="proposal:${p.id}">مشاهدهٔ منبع</button>
            </div>`).join("")}
        </div>
      </div>` : ""}

    <div class="card">
      <div class="section-title">
        <h3>اقدامات <span class="count">${fa(d.actions.length)}</span></h3>
        ${state.addingAction ? "" : `<button class="btn btn-secondary btn-sm" data-add-action>+ افزودن اقدام</button>`}
      </div>
      ${state.addingAction ? `
        <div class="row" style="margin-bottom:.75rem;gap:.5rem">
          <input class="field" id="new-action-title" placeholder="عنوان اقدام" style="max-width:20rem">
          <button class="btn btn-primary btn-sm" data-save-new-action>افزودن</button>
          <button class="btn btn-ghost btn-sm" data-cancel-edit>انصراف</button>
        </div>` : ""}
      ${d.actions.length ? `<div style="display:grid;gap:.75rem">${d.actions.map(actionCard).join("")}</div>`
        : `<p class="muted small" style="text-align:center;padding:1.5rem 0">اقدامی از منابع استخراج نشد.</p>`}
    </div>

    ${d.topics.length ? `
      <div class="card">
        <div class="section-title"><h3>موضوعات مطرح‌شده <span class="count">${fa(d.topics.length)}</span></h3></div>
        ${d.topics.map((t, i) => `
          <div class="topic">
            <p class="tname">${fa(i + 1)}. ${esc(t.title)}</p>
            ${t.summary ? `<p class="tsum">${esc(t.summary)}</p>` : ""}
            ${t.points.length ? `<ul class="bullet-list" style="margin-top:.5rem;list-style:none;padding:0">${t.points.map((p) => `<li><span class="b">•</span>${esc(p)}</li>`).join("")}</ul>` : ""}
          </div>`).join("")}
      </div>` : ""}

    ${d.questions.length ? `
      <div class="card">
        <div class="section-title"><h3>پرسش‌های باز <span class="count">${fa(d.questions.length)}</span></h3></div>
        <ul class="bullet-list" style="list-style:none;padding:0">
          ${d.questions.map((q) => `<li><span class="b">•</span><span>${esc(q.text)}${q.context ? `<span class="muted"> — ${esc(q.context)}</span>` : ""}</span></li>`).join("")}
        </ul>
      </div>` : ""}

    ${d.risks.length ? `
      <div class="card">
        <div class="section-title"><h3>ریسک‌ها و نکات مهم <span class="count">${fa(d.risks.length)}</span></h3></div>
        <ul class="bullet-list" style="list-style:none;padding:0">
          ${d.risks.map((r) => `<li><span class="b">•</span><span>${esc(r.text)}${r.impact ? `<br><span class="muted" style="font-size:.75rem">اثر: ${esc(r.impact)}${r.mitigation ? " · اقدام کاهنده: " + esc(r.mitigation) : ""}</span>` : ""}</span></li>`).join("")}
        </ul>
      </div>` : ""}

    ${d.nextSteps.length ? `
      <div class="card">
        <div class="section-title"><h3>گام‌های بعدی <span class="count">${fa(d.nextSteps.length)}</span></h3></div>
        <ul class="bullet-list" style="list-style:none;padding:0">
          ${d.nextSteps.map((s) => `<li><span class="b">→</span><span>${esc(s.text)}${s.owner || s.when ? `<span class="muted" style="font-size:.75rem"> (${[s.owner, s.when].filter(Boolean).map(esc).join(" · ")})</span>` : ""}</span></li>`).join("")}
        </ul>
      </div>` : ""}

    ${d.notes.length ? `
      <div class="card">
        <div class="section-title"><h3>یادداشت‌ها <span class="count">${fa(d.notes.length)}</span></h3></div>
        <ul class="bullet-list" style="list-style:none;padding:0">${d.notes.map((n) => `<li><span class="b">•</span>${esc(n)}</li>`).join("")}</ul>
      </div>` : ""}

    <p class="muted small tnum" style="text-align:center;padding-bottom:.5rem">
      نسخهٔ ${fa(version.n)} · تولیدشده در ${formatDate(d.generatedAt)}${d.model ? ` · <span class="ltr" style="display:inline-block">${esc(d.model)}</span>` : ""}
    </p>`;
}

function decisionCard(dec, i) {
  if (state.editingDecision === dec.id) {
    return `
      <div class="decision-item editing" style="border-color:var(--brand-300);background:rgba(238,244,251,.35)">
        <div style="display:grid;gap:.75rem">
          <div><label class="label" for="dec-text">متن تصمیم</label><textarea class="field" id="dec-text" rows="2">${esc(dec.text)}</textarea></div>
          <div><label class="label" for="dec-ctx">توضیح</label><textarea class="field" id="dec-ctx" rows="2">${esc(dec.context || "")}</textarea></div>
          <div><label class="label" for="dec-by">تصمیم‌گیرنده</label><input class="field" id="dec-by" value="${esc(dec.by || "")}" placeholder="مشخص نشده"></div>
          <div class="row">
            <button class="btn btn-primary btn-sm" data-save-decision="${dec.id}">ذخیره</button>
            <button class="btn btn-secondary btn-sm" data-cancel-edit>انصراف</button>
            ${can("removeRecord") ? `<button class="btn btn-danger btn-sm" style="margin-inline-start:auto" data-delete-decision="${dec.id}">حذف</button>` : ""}
          </div>
        </div>
      </div>`;
  }
  return `
    <div class="decision-item">
      <div class="spread">
        <p class="txt"><span class="num">${fa(i + 1)}.</span>${esc(dec.text)}</p>
        <button class="btn btn-ghost btn-sm" data-edit-decision="${dec.id}">ویرایش</button>
      </div>
      ${dec.context ? `<p class="muted small" style="margin-top:.375rem;line-height:1.8">${esc(dec.context)}</p>` : ""}
      <div class="action-foot" style="margin-top:.625rem">
        ${dec.by ? `<span class="badge badge-neutral">تصمیم‌گیرنده: ${esc(dec.by)}</span>` : "<span></span>"}
        <button class="linkish" data-evidence="decision:${dec.id}">مشاهدهٔ منبع${dec.evidence.length > 1 ? ` (${fa(dec.evidence.length)} منبع)` : ""}</button>
      </div>
    </div>`;
}

function actionCard(a) {
  if (state.editingAction === a.id) {
    return `
      <div class="action-card editing">
        <div style="display:grid;gap:.75rem">
          <div><label class="label" for="ac-title">عنوان اقدام</label><input class="field" id="ac-title" value="${esc(a.title)}"></div>
          <div><label class="label" for="ac-desc">توضیح</label><textarea class="field" id="ac-desc" rows="2">${esc(a.desc || "")}</textarea></div>
          <div style="display:grid;gap:.75rem;grid-template-columns:1fr 1fr">
            <div><label class="label" for="ac-owner">مسئول</label><input class="field" id="ac-owner" value="${esc(a.owner || "")}" placeholder="مشخص نشده"></div>
            <div><label class="label" for="ac-deadline">مهلت (تاریخ دقیق)</label><input class="field ltr" id="ac-deadline" type="date" value="${esc(a.deadline || "")}"></div>
          </div>
          <div><label class="label" for="ac-dtext">مهلت (متنی)</label><input class="field" id="ac-dtext" value="${esc(a.deadlineText || "")}" placeholder="اگر تاریخ دقیق مشخص نیست، مثلاً «تا جمعه»"></div>
          <div style="display:grid;gap:.75rem;grid-template-columns:1fr 1fr">
            <div><label class="label" for="ac-status">وضعیت</label>
              <select class="field" id="ac-status">${Object.keys(ACTION_STATUS).map((k) => `<option value="${k}" ${a.status === k ? "selected" : ""}>${ACTION_STATUS[k]}</option>`).join("")}</select>
            </div>
            <div><label class="label" for="ac-priority">اولویت</label>
              <select class="field" id="ac-priority"><option value="">مشخص نشده</option>${Object.keys(PRIORITY).map((k) => `<option value="${k}" ${a.priority === k ? "selected" : ""}>${PRIORITY[k]}</option>`).join("")}</select>
            </div>
          </div>
          <div class="row">
            <button class="btn btn-primary btn-sm" data-save-action="${a.id}">ذخیره</button>
            <button class="btn btn-secondary btn-sm" data-cancel-edit>انصراف</button>
            ${can("removeRecord") ? `<button class="btn btn-danger btn-sm" style="margin-inline-start:auto" data-delete-action="${a.id}">حذف</button>` : ""}
          </div>
        </div>
      </div>`;
  }

  const dl = deadlineLabel(a);
  return `
    <div class="action-card">
      <div class="spread">
        <p class="atitle">${esc(a.title)}</p>
        <button class="btn btn-ghost btn-sm" data-edit-action="${a.id}">ویرایش</button>
      </div>
      ${a.desc ? `<p class="adesc">${esc(a.desc)}</p>` : ""}
      <dl class="kv" style="margin-top:.75rem">
        <div><dt>مسئول:</dt><dd>${a.owner
          ? esc(a.owner) + (a.ownerConfirmed ? "" : ` <span class="badge badge-warning" style="margin-inline-start:.25rem">نیازمند تأیید</span>`)
          : `<span class="muted">مشخص نشده</span>`}</dd></div>
        <div><dt>مهلت:</dt><dd class="${dl.exact ? "" : "muted"} tnum">${esc(dl.text)}</dd></div>
        ${a.priority ? `<div><dt>اولویت:</dt><dd>${PRIORITY[a.priority]}</dd></div>` : ""}
      </dl>
      <div class="action-foot">
        <select class="field" style="width:auto;padding:.2rem .5rem;font-size:.75rem;border-radius:8px" data-status-for="${a.id}">
          ${Object.keys(ACTION_STATUS).map((k) => `<option value="${k}" ${a.status === k ? "selected" : ""}>${ACTION_STATUS[k]}</option>`).join("")}
        </select>
        <button class="linkish" data-evidence="action:${a.id}">مشاهدهٔ منبع${a.evidence.length > 1 ? ` (${fa(a.evidence.length)} منبع)` : ""}</button>
      </div>
    </div>`;
}

/* ---------- modals ---------- */
function viewModal() {
  const mod = state.modal;
  let title = "", body = "", wide = false;

  if (mod.type === "evidence") {
    title = "منبع این اطلاعات";
    body = `
      <div style="display:grid;gap:.75rem">
        ${mod.items.map((e) => `
          <div class="evidence-item">
            <p class="src"><span>${e.type === "audio" ? "🎙" : "📄"}</span><span class="ltr">${esc(e.src)}</span></p>
            ${e.quote ? `<blockquote>«${esc(e.quote)}»</blockquote>` : ""}
          </div>`).join("")}
      </div>
      <p class="muted" style="font-size:.75rem;margin-top:1rem">نقل‌قول‌ها مستقیماً از متن منابع بارگذاری‌شده استخراج شده‌اند.</p>`;
  }

  else if (mod.type === "source") {
    const s = mod.source;
    title = s.name;
    wide = true;

    if (s.diarized && s.turns) {
      const stats = speakerStats(s);
      const draft = mod.draft || {};
      const nameOf = (label) => {
        const typed = draft[label] !== undefined ? draft[label] : (s.speakerNames[label] || "");
        return typed.trim() || fallbackSpeaker(label);
      };
      const toneOf = (label) => "spk-" + ((stats.findIndex((x) => x.label === label) % 6) + 1);

      // Consecutive turns from one voice read as a single turn.
      const grouped = [];
      s.turns.forEach((t, i) => {
        const last = grouped[grouped.length - 1];
        if (last && last.speaker === t.speaker) { last.text += " " + t.text; return; }
        grouped.push({ speaker: t.speaker, text: t.text, at: i });
      });

      body = `
        <div class="row" style="margin-bottom:1rem;gap:.5rem">
          <span class="badge badge-neutral">زبان: fa</span>
          ${s.duration ? `<span class="badge badge-neutral">مدت: ${formatDuration(s.duration)}</span>` : ""}
          ${s.chars ? `<span class="badge badge-neutral tnum">${fa(s.chars)} کاراکتر</span>` : ""}
          <span class="badge badge-brand tnum">${fa(stats.length)} گوینده</span>
        </div>

        <div class="spk-panel">
          <p style="font-weight:500;font-size:.875rem;margin-bottom:.25rem">گویندگان</p>
          <p class="muted" style="font-size:.75rem;line-height:1.8;margin-bottom:.75rem">
            صداها از هم تفکیک شده‌اند، اما سامانه نمی‌داند هر صدا متعلق به چه کسی است.
            اگر نام هر گوینده را وارد کنید، در متن و در صورت‌جلسه به همان نام ارجاع داده می‌شود.
          </p>
          ${stats.map((sp) => `
            <div class="spk-row ${toneOf(sp.label)}">
              <span class="spk-dot"></span>
              <input class="field" data-spk-name="${sp.label}"
                     value="${esc(draft[sp.label] !== undefined ? draft[sp.label] : (s.speakerNames[sp.label] || ""))}"
                     placeholder="${esc(fallbackSpeaker(sp.label))}"
                     aria-label="نام ${esc(fallbackSpeaker(sp.label))}" />
              <span class="spk-stat tnum">${fa(sp.count)} نوبت · ${formatDuration(sp.seconds)}</span>
            </div>`).join("")}
          <div class="row" style="margin-top:.75rem;gap:.75rem">
            <button class="btn btn-primary btn-sm" data-spk-save>ذخیرهٔ نام‌ها</button>
            <span class="muted" style="font-size:.75rem">نام‌گذاری، تحلیل این منبع را دوباره اجرا می‌کند.</span>
          </div>
        </div>

        <div class="transcript">
          ${grouped.map((t) => `
            <div class="turn ${toneOf(t.speaker)}">
              <div class="turn-head">
                <span class="ts ltr" style="margin:0">${String(Math.floor(t.at * 3.2)).padStart(2, "0")}:${String((t.at * 17) % 60).padStart(2, "0")}</span>
                <span class="spk-chip">${esc(nameOf(t.speaker))}</span>
              </div>
              <p>${esc(t.text)}</p>
            </div>`).join("")}
        </div>`;
    } else {
      const paras = (s.text || "").split("\n\n");
      body = `
        <div class="row" style="margin-bottom:1rem;gap:.5rem">
          ${s.type === "audio" ? `<span class="badge badge-neutral">زبان: fa</span>` : ""}
          ${s.duration ? `<span class="badge badge-neutral">مدت: ${formatDuration(s.duration)}</span>` : ""}
          ${s.chars ? `<span class="badge badge-neutral tnum">${fa(s.chars)} کاراکتر</span>` : ""}
        </div>
        <div class="transcript">
          ${paras.map((t, i) => s.segments
            ? `<p><span class="ts ltr">${String(Math.floor(i * 3.2)).padStart(2, "0")}:${String((i * 17) % 60).padStart(2, "0")}</span>${esc(t)}</p>`
            : `<p>${esc(t)}</p>`).join("")}
        </div>`;
    }
  }

  else if (mod.type === "versions") {
    const m = currentMeeting();
    title = "تاریخچهٔ نسخه‌ها";
    const labels = { generated: "تولید اولیه", regenerated: "تولید مجدد", user_edit: "ویرایش کاربر" };
    body = `
      <div style="display:grid;gap:.5rem">
        ${m.versions.slice().reverse().map((v, i) => `
          <div class="version-row">
            <div>
              <p style="font-weight:500;font-size:.875rem">نسخهٔ ${fa(v.n)} ${i === 0 ? `<span class="badge badge-success" style="margin-inline-start:.25rem">فعلی</span>` : ""}</p>
              <p class="muted" style="font-size:.75rem;margin-top:.125rem">${labels[v.origin]} · ${formatDate(v.at)}</p>
            </div>
            ${i === 0 ? "" : `<button class="btn btn-ghost btn-sm" data-view-version="${v.n}">مشاهده</button>`}
          </div>`).join("")}
      </div>
      <p class="muted" style="font-size:.75rem;margin-top:1rem">نسخه‌های قبلی هرگز حذف نمی‌شوند؛ تولید مجدد فقط نسخهٔ تازه‌ای اضافه می‌کند.</p>`;
  }

  else if (mod.type === "export") {
    const m = currentMeeting();
    const fmt = { docx: "Word", pdf: "PDF", md: "Markdown" }[mod.format];
    title = "پیش‌نمایش خروجی " + fmt;
    wide = true;
    body = mod.format === "md"
      ? `<div class="transcript"><pre class="ltr" style="white-space:pre-wrap;font-size:.8125rem;line-height:1.8;margin:0;font-family:var(--font);direction:rtl;text-align:right">${esc(toMarkdown(m.minutes))}</pre></div>`
      : `<div class="docpreview">${documentHtml(m.minutes)}</div>`;
    body += `<p class="muted" style="font-size:.75rem;margin-top:1rem">در نسخهٔ نمایشی، خروجی به جای دانلود در همین‌جا نمایش داده می‌شود. در نسخهٔ کامل فایل ${fmt} دانلود می‌شود.</p>`;
  }

  else if (mod.type === "oldVersion") {
    const labels = { generated: "تولید اولیه", regenerated: "تولید مجدد", user_edit: "ویرایش کاربر" };
    title = "نسخهٔ " + fa(mod.n) + " (فقط خواندنی)";
    wide = true;
    body = `<p class="muted small" style="margin-bottom:.75rem">${esc(labels[mod.origin] || "")} · ${formatDate(mod.at)}</p>
            <div class="docpreview">${documentHtml(mod.minutes)}</div>`;
  }

  else if (mod.type === "doc") {
    const d = mod.doc;
    const k = DOC_KINDS[d.kind];
    title = d.title;
    wide = true;
    const facts = [
      ["نوع سند", k.label],
      ["وزن سند در پاسخ‌ها", k.weight],
      ["تاریخ", d.date],
      ["شماره", d.ref],
      ["طرف / مرجع", d.party],
      ["مبلغ", d.amount],
      ["مدت", d.term],
      ["در پاسخ به", d.reply],
    ].filter((f) => f[1]);
    const meta = docMeta(d.id);
    body = `
      <div class="kv" style="margin-bottom:1rem">
        ${facts.map((f) => `<div><dt>${esc(f[0])}:</dt><dd class="tnum">${esc(f[1])}</dd></div>`).join("")}
      </div>
      <div class="transcript"><p>${esc(d.text)}</p></div>
      ${d.fromMeeting ? `<p class="muted small" style="margin-top:1rem">این سند در بخش «ورود دیتا» ثبت شده و خودکار به بایگانی افزوده شده است.</p>` : ""}

      <div class="doc-tabs">
        ${[["comments", "گفت‌وگو", meta.comments.length],
           ["changes", "تغییرات", meta.changes.length],
           ["assign", "واگذاری", meta.assignment ? 1 : 0],
           ["approval", "ارسال و تأیید", submissionsFor(d.id).length]].map(([key, lbl, count]) => `
          <button data-doc-tab="${key}" class="${state.docTab === key ? "on" : ""}">
            ${lbl}${count ? ` <span class="count">${fa(count)}</span>` : ""}
          </button>`).join("")}
      </div>

      ${state.docTab === "comments" ? docComments(d, meta)
        : state.docTab === "changes" ? docChanges(d, meta)
        : state.docTab === "assign" ? docAssignment(d, meta)
        : docApproval(d)}`;
  }

  else if (mod.type === "submission") {
    const sub = state.submissions.find((x) => x.id === mod.id);
    if (!sub) {
      title = "پیدا نشد";
      body = `<p class="muted small">این مورد دیگر در کارتابل نیست.</p>`;
    } else {
      const k = SUBMISSION_KIND[sub.kind];
      const st = SUBMISSION_STATUS[sub.status];
      title = k.glyph + " " + k.label;
      wide = true;
      body = `
        <div class="spread" style="margin-bottom:.75rem">
          <div>
            <p style="font-weight:600">${esc(sub.docTitle)}</p>

/* rendered document, as the DOCX/PDF exporter would lay it out */
function documentHtml(d) {
  const NS = "مشخص نشده";
  let h = `<h1>${esc(d.title)}</h1><p class="doclabel">صورت‌جلسه</p>`;
  const facts = [["تاریخ", d.info.date ? formatDate(d.info.date) : null], ["ساعت", d.info.time], ["محل برگزاری", d.info.location]].filter((f) => f[1]);
  if (facts.length) h += `<h2>اطلاعات جلسه</h2>` + facts.map((f) => `<p>${f[0]}: ${esc(f[1])}</p>`).join("");
  if (d.info.objective) h += `<h2>هدف جلسه</h2><p>${esc(d.info.objective)}</p>`;
  if (d.summary) h += `<h2>خلاصهٔ اجرایی</h2><p>${esc(d.summary)}</p>`;
  if (d.participants.length) h += `<h2>شرکت‌کنندگان</h2><ul>` + d.participants.map((p) => `<li>${esc(p.name)}${p.role ? " (" + esc(p.role) + ")" : ""}</li>`).join("") + `</ul>`;
  if (d.absentees.length) h += `<p><strong>غایبان:</strong> ${d.absentees.map((p) => esc(p.name)).join("، ")}</p>`;
  if (d.topics.length) h += `<h2>موضوعات مطرح‌شده</h2>` + d.topics.map((t, i) => `<p><strong>${fa(i + 1)}. ${esc(t.title)}</strong></p>${t.summary ? `<p>${esc(t.summary)}</p>` : ""}${t.points.length ? `<ul>${t.points.map((p) => `<li>${esc(p)}</li>`).join("")}</ul>` : ""}`).join("");
  if (d.decisions.length) h += `<h2>تصمیمات</h2>` + d.decisions.map((x, i) => `<p><strong>${fa(i + 1)}. ${esc(x.text)}</strong></p>${x.context ? `<p>${esc(x.context)}</p>` : ""}`).join("");
  if (d.proposals.length) h += `<h2>پیشنهادهای مطرح‌شده (تصویب‌نشده)</h2><ul>` + d.proposals.map((p) => `<li>${esc(p.text)}</li>`).join("") + `</ul>`;
  if (d.actions.length) {
    h += `<h2>اقدامات</h2><table><thead><tr><th>عنوان</th><th>مسئول</th><th>مهلت</th><th>وضعیت</th></tr></thead><tbody>`;
    h += d.actions.map((a) => {
      const owner = a.owner ? esc(a.owner) + (a.ownerConfirmed ? "" : " (نیازمند تأیید)") : NS;
      const dl = a.deadline ? formatDate(a.deadline) : (a.deadlineText || NS);
      return `<tr><td>${esc(a.title)}${a.desc ? "<br><small>" + esc(a.desc) + "</small>" : ""}</td><td>${owner}</td><td>${esc(dl)}</td><td>${ACTION_STATUS[a.status]}</td></tr>`;
    }).join("") + `</tbody></table>`;
  }
  if (d.questions.length) h += `<h2>پرسش‌های باز</h2><ul>` + d.questions.map((q) => `<li>${esc(q.text)}</li>`).join("") + `</ul>`;
  if (d.risks.length) h += `<h2>ریسک‌ها و نکات مهم</h2><ul>` + d.risks.map((r) => `<li>${esc(r.text)}${r.impact ? " — اثر: " + esc(r.impact) : ""}</li>`).join("") + `</ul>`;
  if (d.nextSteps.length) h += `<h2>گام‌های بعدی</h2><ul>` + d.nextSteps.map((s) => `<li>${esc(s.text)}</li>`).join("") + `</ul>`;
  if (d.notes.length) h += `<h2>یادداشت‌ها</h2><ul>` + d.notes.map((n) => `<li>${esc(n)}</li>`).join("") + `</ul>`;
  if (d.sourcesUsed.length) h += `<h2>منابع</h2><ul>` + d.sourcesUsed.map((s) => `<li>${esc(s)}</li>`).join("") + `</ul>`;
  return h;
}

function toMarkdown(d) {
  const NS = "مشخص نشده";
  const L = ["# " + d.title, ""];
  if (d.info.date) L.push("- **تاریخ:** " + formatDate(d.info.date));
  if (d.info.time) L.push("- **ساعت:** " + d.info.time);
  if (d.info.location) L.push("- **محل برگزاری:** " + d.info.location);
  L.push("");
  if (d.summary) L.push("## خلاصهٔ اجرایی", "", d.summary, "");
  if (d.decisions.length) {
    L.push("## تصمیمات");
    d.decisions.forEach((x, i) => L.push(fa(i + 1) + ". **" + x.text + "**"));
    L.push("");
  }
  if (d.proposals.length) { L.push("## پیشنهادهای مطرح‌شده"); d.proposals.forEach((p) => L.push("- " + p.text)); L.push(""); }
  if (d.actions.length) {
    L.push("## اقدامات", "", "| عنوان | مسئول | مهلت | وضعیت |", "| --- | --- | --- | --- |");
    d.actions.forEach((a) => {
      const owner = a.owner ? a.owner + (a.ownerConfirmed ? "" : " (نیازمند تأیید)") : NS;
      const dl = a.deadline ? formatDate(a.deadline) : (a.deadlineText || NS);
      L.push("| " + a.title + " | " + owner + " | " + dl + " | " + ACTION_STATUS[a.status] + " |");
    });
    L.push("");
  }
  if (d.questions.length) { L.push("## پرسش‌های باز"); d.questions.forEach((q) => L.push("- " + q.text)); L.push(""); }
  if (d.risks.length) { L.push("## ریسک‌ها و نکات مهم"); d.risks.forEach((r) => L.push("- " + r.text)); L.push(""); }
  return L.join("\n");
}

function childCases(id) { return CASE_LIST.filter((c) => c.parent === id); }
function parentCase(c) { return c && c.parent ? CASE_LIST.find((x) => x.id === c.parent) : null; }

/* A subject and everything filed under it, however deep. */
function caseTree(id) {
  const ids = [id];
  for (let i = 0; i < ids.length; i++) {
    childCases(ids[i]).forEach((c) => { if (ids.indexOf(c.id) === -1) ids.push(c.id); });
  }
  return ids;
}
