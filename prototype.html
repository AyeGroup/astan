/* Evidence: which document a sentence in the report came from, and the exact
   line. The minutes side already has an evidence modal; case claims open the
   very same one. */
/* Whatever is entered in the first tab is an archive document from the moment
   it has content — minutes generated from a recording, or a letter typed
   straight in. Nothing has to be filed twice. */
function liveMeetingDocs() {
  return state.meetings
    .filter((m) => m.minutes || m.sources.some((s) => s.text))
    .map((m) => {
      const text = m.minutes
        ? (m.minutes.summary || "") + " " + m.minutes.actions
            .map((a) => "اقدام: " + a.title + " — مسئول: " + (a.owner || "مشخص نشده")).join(" ")
        : (m.description ? m.description + " " : "") +
          m.sources.map((s) => s.text || "").join(" ");
      return {
        id: "m-" + m.id,
        kind: m.kind || "meeting_minutes",
        title: m.minutes ? m.minutes.title : m.title,
        date: m.date ? formatDate(m.date) : "بدون تاریخ",
        party: "ثبت‌شده در ورود دیتا",
        cases: matchingCases(m.title + " " + text),
        fromMeeting: m.id,
        text: text,
      };
    });
}

/* Which subjects a new document belongs to, decided by the same filter that
   answers questions — so a document that would be retrieved for a subject is
   also listed under it. */
function matchingCases(text) {
  const hay = " " + norm(text) + " ";
  return CASE_LIST.filter((c) => {
    const words = terms(c.title).filter((w) => w.length > 2);
    if (!words.length) return false;
    const hits = words.filter((w) => hay.indexOf(w) !== -1).length;
    return hits / words.length >= 0.5;
  }).map((c) => c.id);
}

function archiveAll() { return ARCHIVE.concat(liveMeetingDocs()); }

/* --- the short answer, in plain words ----------------------------------- */
/* ==========================================================================
   The filter

   Two halves, both explicit.

   Lexical: Persian writes one word several ways — «قراردادها» and «قرارداد»,
   «ي» and «ی», a half-space or a space inside «صورت‌جلسه». All of it is folded
   away before anything is compared, so a manager who types the word the normal
   way finds the document that spells it the careful way.

   Semantic: a manager asks about «بودجه»; the file says «اعتبار». Nothing in
   the letters of those two words connects them, so the connection is written
   down. It is a small dictionary rather than a model, which means it can be
   read, corrected and argued with — the right trade at this stage.
   ========================================================================== */

const FOLD = [[/[يیى]/g, "ی"], [/[كک]/g, "ک"], [/[ۀةه]/g, "ه"], [/[أإآا]/g, "ا"],
              [/[ؤو]/g, "و"], [/[ًٌٍَُِّْٰٔ]/g, ""], [/[\u200c\u200f\u200e]/g, " "]];

function norm(v) {
  let t = String(v == null ? "" : v);
  FOLD.forEach(([re, to]) => { t = t.replace(re, to); });
  t = t.replace(/[۰-۹]/g, (d) => String("۰۱۲۳۴۵۶۷۸۹".indexOf(d)));
  return t.replace(/[^\wآ-ی\u0600-\u06FF\s]/g, " ").replace(/\s+/g, " ").trim();
}

/* Light stemming. Persian plurals and comparatives carry no meaning for
   retrieval; stripping them is what lets «قراردادها» find «قرارداد». */
const SUFFIXES = ["هایی", "هایم", "هایش", "های", "هام", "ها", "انی", "ترین", "تر", "ی"];
function stem(w) {
  for (const s of SUFFIXES) {
    if (w.length > s.length + 2 && w.slice(-s.length) === s) return w.slice(0, -s.length);
  }
  return w;
}

const STOP = new Set(("و در به از با که را این آن های یک برای تا هم بر یا اگر چه چی چیست چیه "
  + "کدام چطور چگونه آیا لطفا لطفاً بگو بده کن شود شده است هست بود می ها مورد باره درباره "
  + "من ما شما او آنها خود همه هر نیز باید توسط طی روی زیر بین پس پیش").split(" "));

function terms(v) {
  return norm(v).split(" ")
    .filter((w) => w.length > 1 && !STOP.has(w))
    .map(stem)
    .filter((w) => w.length > 1);
}

/* The written-down half of "meaning". Each row is a set of words this archive
   uses interchangeably; any one of them retrieves the others. */
const SYNONYMS = [
  ["امنیت", "حفاظت", "ایمنی", "صیانت", "رمزنگاری"],
  ["اعتبار", "بودجه", "تخصیص", "مالی", "ردیف", "هزینه", "مبلغ"],
  ["قرارداد", "پیمان", "الحاقیه", "تفاهم", "موافقتنامه"],
  ["تاخیر", "عقب", "معطل", "دیرکرد", "کند", "طولانی"],
  ["متوقف", "توقف", "راکد", "معلق", "بلاتکلیف"],
  ["مصوبه", "تصمیم", "ابلاغ", "مصوب", "شورا", "تصویب"],
  ["نامه", "مکاتبه", "مراسله", "پاسخ", "درخواست", "پیگیری"],
  ["مرکز", "دیتاسنتر", "سایت"],
  ["گزارش", "پیشرفت", "وضعیت", "عملکرد", "بازخورد"],
  ["سند", "مدرک", "مستند", "پرونده", "سابقه"],
  ["داده", "اطلاعات", "دیتا"],
  ["تبادل", "اتصال", "تعامل", "یکپارچه", "ارتباط"],
  ["مهلت", "موعد", "سررسید", "زمان", "پایان", "تمدید"],
  ["دستگاه", "سازمان", "وزارت", "نهاد", "اداره", "شرکت"],
  ["معماری", "طراحی", "الگو", "مدل"],
  ["جلسه", "نشست", "کمیته", "کارگروه", "ملاقات", "مذاکره"],
  ["قانون", "مقررات", "ماده", "تبصره", "بند", "الزام"],
  ["راهاندازی", "بهرهبرداری", "اجرا", "پیادهسازی", "تحویل"],
];

const SYN = (() => {
  const map = {};
  SYNONYMS.forEach((group) => {
    const stemmed = group.map((w) => stem(norm(w)));
    stemmed.forEach((w) => { map[w] = stemmed; });
  });
  return map;
})();

/* The words of one document, stemmed and deduplicated. Comparing word to word
   rather than by substring is what keeps «رد» out of «مورد» and «نامه» out of
   «برنامه». */
function docTokens(doc) {
  return new Set(terms(doc.title + " " + (doc.party || "") + " " + (doc.ref || "")
    + " " + doc.text));
}

/* How well one word of the question is answered by one document:
   1 for the word itself, 0.55 for a word this archive uses to mean the same
   thing — always less than a direct hit, so a document that uses the
   manager's own words still ranks first. */
function termHit(tokens, term) {
  if (tokens.has(term)) return 1;
  if (term.length >= 4) {
    for (const w of tokens) {
      if (w.length >= 4 && (w.indexOf(term) === 0 || term.indexOf(w) === 0)) return 1;
    }
  }
  const alts = SYN[term];
  if (alts) { for (const alt of alts) { if (tokens.has(alt)) return 0.55; } }
  return 0;
}

/* The best line to show for a match: the sentence carrying most of the
   question. */
function bestQuote(doc, matched) {
  // A colon does not end a sentence: quoting "موضوع قرارداد:" back at someone
  // answers nothing.
  const list = clauses(doc.text);
  if (!list.length) return String(doc.text || "").slice(0, 180);
  let best = list[0], bestHits = -1;
  list.forEach((s) => {
    const tokens = new Set(terms(s));
    const hits = matched.reduce((sum, t) => sum + termHit(tokens, t), 0);
    // On a tie the fuller line is the more useful one.
    if (hits > bestHits || (hits === bestHits && s.length > best.length)) { bestHits = hits; best = s; }
  });
  return best;
}

/* Search a pool of documents.

   A question about something the archive has never heard of comes back empty.
   That is the one answer this stage of the product must never fake, so it is
   the first thing decided: if no word of the question appears anywhere in the
   pool — directly or through a word meaning the same — there is nothing to
   say. */
const MIN_COVERAGE = 0.34;
const MIN_SCORE = 0.2;
/* Below this share of the question understood, the honest answer is nothing. */
const MIN_UNDERSTOOD = 0.6;
/* A word in almost every document cannot tell them apart, so it cannot carry
   a question on its own. */
const UBIQUITOUS = 0.7;
/* Words shorter than this are idiom often enough that their absence proves
   nothing — «رد و بدل» is a way of saying "exchanged", not a subject. */
const SUBSTANTIVE = 4;

function searchDocs(query, pool, opts) {
  // The chat asks a question and must be allowed to answer "nothing"; a search
  // box is a search box and should cast wider. Same engine, different nerve.
  const o = opts || {};
  const minCoverage   = o.minCoverage   != null ? o.minCoverage   : MIN_COVERAGE;
  const minScore      = o.minScore      != null ? o.minScore      : MIN_SCORE;
  const minUnderstood = o.minUnderstood != null ? o.minUnderstood : MIN_UNDERSTOOD;
  const needsDiscriminating = o.requireDiscriminating !== false;
  const limit = o.limit || 5;

  const asked = [...new Set(terms(query))];
  if (!asked.length || !pool.length) return [];

  const tokenised = pool.map((doc) => ({ doc, tokens: docTokens(doc) }));

  // Keep only the words this archive can actually discriminate on. A word in
  // no document at all is not evidence of irrelevance — it is just a word the
  // file does not use, and letting it count would sink a good question.
  const df = {};
  asked.forEach((t) => {
    df[t] = tokenised.filter((e) => termHit(e.tokens, t) > 0).length;
  });
  const qt = asked.filter((t) => df[t] > 0);
  if (!qt.length) return [];

  // Did we understand enough of what was asked? Counting only substantive
  // words, because a question is about its nouns.
  const substantive = asked.filter((t) => t.length >= SUBSTANTIVE || df[t] > 0);
  const understood = substantive.filter((t) => df[t] > 0).length;
  if (substantive.length && understood / substantive.length < minUnderstood) return [];

  // And at least one understood word has to discriminate.
  if (needsDiscriminating && !qt.some((t) => df[t] / pool.length < UBIQUITOUS)) return [];

  const idf = {};
  let totalIdf = 0;
  qt.forEach((t) => {
    idf[t] = Math.log(1 + pool.length / df[t]);
    totalIdf += idf[t];
  });
  const phrase = asked.length > 1 ? norm(query) : null;

  return tokenised
    .map(({ doc, tokens }) => {
      const titleTokens = new Set(terms(doc.title));
      let weight = 0, covered = 0, inTitle = 0;
      const matched = [];
      qt.forEach((t) => {
        const hit = termHit(tokens, t);
        if (hit) { weight += hit * idf[t]; covered += 1; matched.push(t); }
        if (termHit(titleTokens, t)) inTitle += 1;
      });
      let score = totalIdf ? weight / totalIdf : 0;
      // A document whose title is about the subject beats one that mentions it
      // in passing.
      if (inTitle) score += 0.15 * (inTitle / qt.length);
      if (phrase && norm(doc.title + " " + doc.text).indexOf(phrase) !== -1) score += 0.4;
      return { doc, score, coverage: covered / qt.length, matched };
    })
    .filter((r) => r.coverage >= minCoverage && r.score > minScore)
    .sort((a, b) => b.score - a.score)
    .slice(0, limit)
    .map((r) => Object.assign(r, { quote: bestQuote(r.doc, r.matched) }));
}

/* ==========================================================================
   Where the file contradicts itself

   An archive that spans five years will say two different things about the
   same subject, and the manager's real question is which of the two to
   believe. So the two lines are put side by side, each labelled with what its
   document is — an official progress report and a personal note are not equal
   evidence — and the reader decides. Nothing is hidden and nothing wins
   automatically; picking a side is not this product's job.
   ========================================================================== */
const STANCES = [
  { key: "stalled", label: "متوقف / بی‌نتیجه", tone: "danger",
    res: [/متوقف/, /توقف/, /راکد/, /معلق/, /بلاتکلیف/, /انجام\s*نشده/, /پاسخی\s*(?:ثبت|دریافت)\s*نشده/] },
  { key: "done", label: "انجام‌شده / تکمیل", tone: "success",
    res: [/تکمیل\s*شده/, /انجام\s*‌?شده/, /نهایی\s*شده/, /راه‌?اندازی\s*شد/,
          /بهره‌?برداری\s*(?:کامل|شد)/, /تحویل\s*شد/] },
];

function stanceOf(text) {
  for (const st of STANCES) { for (const re of st.res) if (re.test(text)) return st; }
  return null;
}

/* The sentences of a document that assert a state of affairs. */
function claimsOf(doc) {
  return clauses(doc.text)
    .map((t) => ({ doc: doc, text: t.trim(), stance: stanceOf(t) }))
    .filter((c) => c.stance);
}

/* Not every document carries the same weight, and the order they are read in
   should say so. */
const AUTHORITY = ["law", "resolution", "contract", "contract_annex", "mou",
                   "letter_in", "letter_out", "progress_report", "meeting_minutes",
                   "analysis", "negotiation", "content_doc", "related_docs", "note"];
function authority(doc) {
  const i = AUTHORITY.indexOf(doc.kind);
  return i === -1 ? 0 : AUTHORITY.length - i;
}

function findConflicts(docs) {
  const claims = [];
  docs.forEach((d) => claimsOf(d).forEach((c) => claims.push(c)));
  const out = [], seen = {};
  for (let i = 0; i < claims.length; i++) {
    for (let j = i + 1; j < claims.length; j++) {
      const a = claims[i], b = claims[j];
      if (a.doc.id === b.doc.id || a.stance.key === b.stance.key) continue;
      // Two lines only contradict each other if they are about the same thing.
      if (overlap(a.text, b.text) < 0.5) continue;
      const key = [a.doc.id, b.doc.id].sort().join("|");
      if (seen[key]) continue;
      seen[key] = true;
      // The weightier document always sits first, so every pair reads the same
      // way: what the record says, then what disputes it.
      const pair = authority(a.doc) >= authority(b.doc) ? { a: a, b: b } : { a: b, b: a };
      out.push(pair);
    }
  }
  return out.slice(0, 4);
}

/* A letter that went out and was never answered is the one thing in an archive
   nobody notices until it is too late. */
function unansweredLetters(docs) {
  return docs.filter((d) => d.kind === "letter_out" && d.ref &&
    !docs.some((x) => x.kind === "letter_in" && x.reply === d.ref));
}

function caseCounts(docs) {
  return {
    docs: docs.length,
    unanswered: unansweredLetters(docs).length,
    stalled: docs.filter((d) => claimsOf(d).some((c) => c.stance.key === "stalled")).length,
    conflicts: findConflicts(docs).length,
  };
}

/* ==========================================================================
   What is on the record for a document

   Comments, tracked changes and one assignment. Kept beside the document
   rather than in a separate task list, because the question a manager asks is
   always "what is happening with *this*".
   ========================================================================== */
function docMeta(id) {
  if (!state.docMeta[id]) {
    state.docMeta[id] = { comments: [], changes: [], assignment: null };
  }
  return state.docMeta[id];
}
function stamp() {
  const d = new Date();
  return formatDate(todayIso()) + " · " + fa(pad2(d.getHours()) + ":" + pad2(d.getMinutes()));
}
function addComment(id, text) {
  docMeta(id).comments.push({
    role: state.role, who: me().name, text: text, at: stamp(),
  });
}
function addChange(id, what, from, to) {
  docMeta(id).changes.push({
    role: state.role, who: me().name, what: what, from: from, to: to, at: stamp(),
  });
}

/* A few documents arrive with a history, so the feature is visible before

function seedDocMeta() {

  a8.comments.push({ role: "manager", who: ROLES.manager.name, at: "۱۳۹۸/۰۷/۰۳ · ۱۶:۰۵",
    text: "این گزارش با یادداشت شخصی من دربارهٔ وضعیت سند امنیت هم‌خوان نیست. هر دو در پرونده بماند." });
  a8.changes.push({ role: "secretary", who: ROLES.secretary.name, at: "۱۳۹۸/۰۷/۰۲ · ۱۰:۲۰",
    what: "تاریخ سند", from: "۱۳۹۸/۰۶/۳۱", to: "۱۳۹۸/۰۷/۰۱" });
}

/* ==========================================================================
   The tray — the way back up

   The manager already hands work down; this is the return path. A secretary
   sends one thing at a time: a document for final approval, or a report on
   work that was assigned. The manager approves it, sends it back for
   correction, or writes a note and leaves it open.

   Nothing here is a private message. Every move is also written onto the
   document's own record, because six months later the question is never
   "what was in the tray" — it is "who approved this, and when".
   ========================================================================== */
const SUBMISSION_KIND = {
  approval: { label: "درخواست تأیید", glyph: "🖋" },
  report:   { label: "گزارش کار",     glyph: "📋" },
};

const SUBMISSION_STATUS = {
  pending:      { label: "در انتظار بررسی مدیر", tone: "brand" },
  approved:     { label: "تأیید نهایی شد",        tone: "success" },
  returned:     { label: "اعاده برای اصلاح",      tone: "warning" },
  acknowledged: { label: "خوانده و ثبت شد",       tone: "neutral" },
};

/* What the manager can do with one submission. A note deliberately changes
   nothing: "I read it and I am still thinking" is a real answer, and forcing
   it into approve/reject is how approval queues start lying. */
const DECISIONS = {
  approve:     { label: "تأیید نهایی",      status: "approved",     tone: "approve" },
  return:      { label: "اعاده برای اصلاح", status: "returned",     tone: "return" },
  acknowledge: { label: "خوانده شد",        status: "acknowledged", tone: "" },
  note:        { label: "یادداشت مدیر",     status: null,           tone: "" },
};

function submissionsFor(docId) {
  return state.submissions.filter((x) => x.docId === docId);
}

/* What is waiting for me right now: for the manager, everything undecided;
   for the secretary, every answer they have not read yet. */
function myInbox() {
  return state.submissions.filter((x) => can("decide")
    ? x.status === "pending"
    : x.status !== "pending" && !x.seen.secretary);
}
function inboxCount() { return myInbox().length; }
function isUnread(sub) { return can("decide") ? !sub.seen.manager : !sub.seen.secretary; }

function submit(docId, docTitle, kind, note, assignmentTask) {
  const sub = {
    id: nid("sub"), kind: kind, docId: docId, docTitle: docTitle,
    from: state.role, to: "manager", note: note, at: stamp(),
    assignmentTask: assignmentTask || null, status: "pending",
    seen: { manager: false, secretary: true }, replies: [],
  };
  state.submissions.unshift(sub);
  addComment(docId, (kind === "approval" ? "ارسال برای تأیید مدیر — " : "گزارش کار — ") + note);
  return sub;
}

function decideOn(sub, action, text) {
  const d = DECISIONS[action];
  sub.replies.push({ role: state.role, who: me().name, at: stamp(), action: action, text: text || "" });
  if (d.status) sub.status = d.status;
  sub.seen = { manager: true, secretary: false };
  addComment(sub.docId, d.label + (text ? " — " + text : ""));
}

/* A few items already in the tray, so the loop is visible before anyone has
   sent anything: two waiting on the manager and one already answered. */
function seedSubmissions() {
  state.submissions = [
    { id: nid("sub"), kind: "approval", docId: "a14",
      docTitle: "پیگیری تعیین تکلیف اعتبار سند امنیت",
      from: "secretary", to: "manager", at: "۱۴۰۰/۰۶/۰۳ · ۰۹:۲۰",
      note: "پیش‌نویس نامهٔ یادآوری آماده شد. پیش از ارسال به سازمان برنامه و بودجه تأیید بفرمایید.",
      assignmentTask: null, status: "pending",
      seen: { manager: false, secretary: true }, replies: [] },

    { id: nid("sub"), kind: "report", docId: "a5",
      docTitle: "نامهٔ درخواست گزارش پیشرفت",
      from: "secretary", to: "manager", at: "۱۴۰۰/۰۶/۰۲ · ۱۶:۴۵",
      note: "سه بار پیگیری تلفنی شد و یک نامهٔ یادآوری هم ثبت شد؛ تا امروز پاسخی دریافت نشده است.",
      assignmentTask: "پیگیری پاسخ نامهٔ ۱۲/۸۸۹۰ از سازمان برنامه و بودجه",
      status: "pending", seen: { manager: false, secretary: true }, replies: [] },

    { id: nid("sub"), kind: "approval", docId: "a9",
      docTitle: "صورت‌جلسهٔ کمیتهٔ راهبری — بازنگری مهلت‌ها",
      from: "secretary", to: "manager", at: "۱۳۹۸/۰۸/۰۵ · ۱۰:۱۰",
      note: "صورت‌جلسه پیاده و بازبینی شد؛ برای ثبت نهایی در بایگانی تأیید بفرمایید.",
      assignmentTask: null, status: "approved", seen: { manager: true, secretary: true },
      replies: [{ role: "manager", who: ROLES.manager.name, at: "۱۳۹۸/۰۸/۰۵ · ۱۱:۳۰",
                  action: "approve", text: "تأیید شد. مهلت جدید را در گزارش بعدی هم یادآوری کنید." }] },
  ];
}

/* Every document filed under a subject: the seeded archive plus anything
   entered in the first tab whose own words put it here. */
function caseDocs(caseId) {
  const ids = caseTree(caseId);
  const inScope = (d) => d.cases.some((c) => ids.indexOf(c) !== -1);
  return ARCHIVE.filter(inScope).concat(liveMeetingDocs().filter(inScope));
}

/* --- views -------------------------------------------------------------- */
function viewCases() {
  return `
    <div class="spread" style="margin-bottom:1.5rem">
      <div>
        <h1 style="font-size:1.5rem;font-weight:600">موضوع‌های من</h1>
        <p class="muted small" style="margin-top:.25rem">
          یک موضوع را باز کنید و هر پرسشی دارید بپرسید؛ اسناد مرتبط با آن نشان داده می‌شود.
        </p>
      </div>
      <button class="btn btn-secondary" data-new-case>+ موضوع جدید</button>
    </div>

    <div class="stack" style="gap:.75rem">
      ${CASE_LIST.filter((c) => !c.parent).map(caseCard).join("")}
    </div>`;
}

/* A subject and, indented under it, the projects it contains — because a
   programme's documents are its projects' documents. */
function caseCard(c, depth) {
  const kids = childCases(c.id);
  const counts = caseCounts(caseDocs(c.id));
  const pad = depth ? `margin-inline-start:${depth * 1.5}rem` : "";
  return `
    <div class="card subject" data-open-case="${c.id}" style="${pad}">
      <div class="spread">
        <div>
          <p style="font-weight:600;font-size:${depth ? ".9375rem" : "1.0625rem"}">${esc(c.title)}</p>
          ${c.note ? `<p class="muted small" style="margin-top:.25rem">${esc(c.note)}</p>` : ""}
          <p class="muted small tnum" style="margin-top:.35rem">
            ${fa(counts.docs)} سند${kids.length ? ` · ${fa(kids.length)} پروژهٔ زیرمجموعه` : ""}
          </p>
        </div>
        <div class="row" style="gap:.35rem">
          ${counts.conflicts ? `<span class="badge badge-warning tnum">${fa(counts.conflicts)} ناهم‌خوانی</span>` : ""}
          ${counts.unanswered ? `<span class="badge badge-danger tnum">${fa(counts.unanswered)} مکاتبهٔ بی‌پاسخ</span>` : ""}
        </div>
      </div>
    </div>
    ${kids.map((k) => caseCard(k, (depth || 0) + 1)).join("")}`;
}

/* --- the subject page: ask, then read ------------------------------------ */
function viewCase() {
  const id = state.route.id;
  const c = CASE_LIST.find((x) => x.id === id);
  if (!c) return `<p>موضوع پیدا نشد.</p>`;
  const docs = caseDocs(id);
  const thread = state.chat[id] || [];
  const parent = parentCase(c);
  const kids = childCases(c.id);
  const counts = caseCounts(docs);
  const asked = thread.filter((t) => t.from === "user").map((t) => t.text);

  return `
    <button class="linkish" style="font-size:.875rem;margin-bottom:1rem;text-decoration:none;color:var(--s-500)" data-go="cases">← بازگشت به موضوع‌ها</button>

    <div class="card">
      ${parent ? `<p class="muted small" style="margin-bottom:.35rem">زیرمجموعهٔ
        <button class="linkish" style="font-size:.8125rem;color:var(--brand-600)" data-open-case="${parent.id}">${esc(parent.title)}</button></p>` : ""}
      <h1 style="font-size:1.25rem;font-weight:600">${esc(c.title)}</h1>
      ${c.note ? `<p class="muted small" style="margin-top:.35rem">${esc(c.note)}</p>` : ""}
      ${kids.length ? `
        <div class="row" style="margin-top:.75rem">
          <span class="muted small">پروژه‌های زیرمجموعه:</span>
          ${kids.map((k) => `<button class="btn btn-secondary btn-sm" data-open-case="${k.id}">
            ${esc(k.title)} <span class="muted tnum">(${fa(caseDocs(k.id).length)})</span>
          </button>`).join("")}
        </div>` : ""}

      <div class="countbar">
        <div class="countbox"><b class="tnum">${fa(counts.docs)}</b><span>سند</span></div>
        <div class="countbox ${counts.unanswered ? "bad" : ""}"><b class="tnum">${fa(counts.unanswered)}</b><span>مکاتبهٔ بی‌پاسخ</span></div>
        <div class="countbox ${counts.stalled ? "warn" : ""}"><b class="tnum">${fa(counts.stalled)}</b><span>سند با موضوع متوقف</span></div>
        <div class="countbox ${counts.conflicts ? "warn" : ""}"><b class="tnum">${fa(counts.conflicts)}</b><span>ناهم‌خوانی</span></div>
      </div>
    </div>

    ${conflictPanel(findConflicts(docs))}

    <div class="card chat" style="margin-top:1rem">
      <div class="section-title"><h3>سؤال‌هایتان را از من بپرسید</h3></div>

      ${(c.starters || []).length ? `
        <div class="qgrid" style="margin-bottom:.875rem">
          ${c.starters.map((q) => `
            <button class="qbtn ${asked.indexOf(q) !== -1 ? "on" : ""}" data-ask="${esc(q)}">${esc(q)}</button>
          `).join("")}
        </div>` : ""}

      <div class="chat-log">
        ${thread.length === 0 ? `
          <div class="chat-hint">
            <p>هرچه می‌خواهید بپرسید — مثلاً «اعتبار مطالعات امنیت چه شد؟» یا «قرارداد مرکز داده».</p>
            <p class="muted small" style="margin-top:.35rem">
              من در این مرحله نتیجه‌گیری نمی‌کنم؛ فقط سندهای مرتبط و همان جمله‌ای را که پیدا کرده‌ام نشان می‌دهم.
            </p>
          </div>` : thread.map(chatBubble).join("")}
        ${state.chatBusy ? `<div class="chat-row bot"><div class="bubble typing"><span></span><span></span><span></span></div></div>` : ""}
      </div>

      <div class="row" style="margin-top:.875rem">
        <input class="field" id="chat-q" style="flex:1;min-width:14rem" placeholder="سؤالتان را بنویسید…" autocomplete="off">
        <button class="btn btn-primary" data-chat-send>بپرس</button>
      </div>
    </div>

    <div class="card" style="margin-top:1rem;padding:.5rem">
      <div class="section-title" style="padding:.5rem .75rem 0"><h3>اسناد مرتبط با این موضوع <span class="count">${fa(docs.length)}</span></h3></div>
      <div class="stack" style="gap:.5rem;padding:.5rem">${docs.map((d) => docRow(d)).join("")}</div>
    </div>`;
}

/* Two documents, one subject, two answers. Both stay on the record. */
function conflictPanel(pairs) {
  if (!pairs.length) return "";
  const side = (claim) => {
    const k = DOC_KINDS[claim.doc.kind];
    return `
      <div class="side">
        <div class="row" style="gap:.35rem;margin-bottom:.4rem">
          <span class="badge badge-${claim.stance.tone}">${claim.stance.label}</span>
          <span class="badge badge-${k.tone}">${k.glyph} ${k.label}</span>
          <span class="muted small">${esc(k.weight)}</span>
        </div>
        <p>«${esc(claim.text)}»</p>
        <button class="cite" data-doc="${claim.doc.id}">${esc(claim.doc.title)} · ${esc(claim.doc.date)}</button>
      </div>`;
  };
  return `
    <div class="card" style="margin-top:1rem">
      <div class="section-title">
        <h3>⚠️ موارد ناهم‌خوان <span class="count">${fa(pairs.length)}</span></h3>
      </div>
      <p class="muted small" style="margin:-.5rem 0 .25rem;line-height:1.9">
        دو سند دربارهٔ یک موضوع دو چیز متفاوت گفته‌اند. هیچ‌کدام حذف یا ترجیح داده نمی‌شود؛
        در کنار هم و همراه با نوع سند نشان داده می‌شود تا خودتان قضاوت کنید.
      </p>
      ${pairs.map((p) => `<div class="conflict-sides">${side(p.a)}${side(p.b)}</div>`).join("")}
    </div>`;
}

function chatBubble(msg) {
  if (msg.from === "user") {
    return `<div class="chat-row user"><div class="bubble">${esc(msg.text)}</div></div>`;
  }
  if (!msg.hits.length) {
    return `<div class="chat-row bot"><div class="bubble">
      <p>در اسناد این موضوع چیزی دربارهٔ «${esc(msg.text)}» پیدا نکردم.</p>
      <p class="muted small" style="margin-top:.35rem">یعنی چنین سندی در بایگانی ثبت نشده — نه اینکه پاسخ را نمی‌دانم.</p>
    </div></div>`;
  }
  return `<div class="chat-row bot"><div class="bubble">
    <p style="margin-bottom:.6rem">در ${fa(msg.hits.length)} سند به این موضوع اشاره شده است:</p>
    ${msg.hits.map((hit, i) => `
      <div class="hit" data-doc="${hit.id}">
        <p class="hit-head">در سند ${fa(i + 1)} — ${esc(hit.title)}
          <span class="muted tnum" style="font-weight:400">(${esc(hit.date)} · ${esc(hit.kind)})</span>
        </p>
        <p class="hit-quote">«${esc(hit.quote)}»</p>
      </div>`).join("")}
    <p class="muted small" style="margin-top:.6rem">
      برای دیدن کل سند روی آن کلیک کنید. در این مرحله فقط سندهای مرتبط نشان داده می‌شود و تحلیلی ارائه نمی‌شود.
    </p>
  </div></div>`;
}

/* One question at a time, so an interrupted run never leaves a spinner. */
let chatRun = 0;

function askChat(caseId, question) {
  const token = ++chatRun;
  if (!state.chat[caseId]) state.chat[caseId] = [];
  state.chat[caseId].push({ from: "user", text: question, hits: [] });
  state.chatBusy = true;
  render();

  setTimeout(() => {
    if (token !== chatRun) return;
    const found = searchDocs(question, caseDocs(caseId)).map((r) => ({
      id: r.doc.id,
      title: r.doc.title,
      date: r.doc.date,
      kind: DOC_KINDS[r.doc.kind].label,
      quote: r.quote,
    }));
    state.chat[caseId].push({ from: "bot", text: question, hits: found });
    state.chatBusy = false;
    render();
    const log = document.querySelector(".chat-log");
    if (log) log.scrollTop = log.scrollHeight;
  }, 520);
}

/* --- the tray ----------------------------------------------------------- */
function viewInbox() {
  const boss = can("decide");
  const all = state.submissions;
  const open = all.filter((x) => x.status === "pending");
  const closed = all.filter((x) => x.status !== "pending");
  const unreadClosed = closed.filter((x) => !x.seen.secretary).length;

  const group = (title, hint, rows) => rows.length ? `
    <div class="card" style="margin-top:1rem">
      <div class="section-title"><h3>${title} <span class="count">${fa(rows.length)}</span></h3></div>
      ${hint ? `<p class="muted small" style="margin:-.5rem 0 .75rem;line-height:1.9">${hint}</p>` : ""}
      <div class="stack" style="gap:.625rem">${rows.map(submRow).join("")}</div>
    </div>` : "";

  return `
    <div class="spread" style="margin-bottom:.5rem">
      <div>
        <h1 style="font-size:1.5rem;font-weight:600">کارتابل</h1>
        <p class="muted small" style="margin-top:.25rem;max-width:44rem;line-height:1.9">
          ${boss
            ? "هرچه منشی برای تأیید یا گزارش فرستاده، اینجاست. می‌توانید تأیید کنید، برای اصلاح برگردانید، یا فقط یادداشت بگذارید."
            : "هرچه برای مدیر فرستاده‌اید و پاسخی که گرفته‌اید. ارسال از داخل هر سند انجام می‌شود."}
        </p>
      </div>
    </div>

    <div class="card">
      <div class="countbar" style="margin-top:0">
        <div class="countbox ${open.length ? "warn" : ""}"><b class="tnum">${fa(open.length)}</b><span>${boss ? "در انتظار بررسی شما" : "در انتظار پاسخ مدیر"}</span></div>
        <div class="countbox"><b class="tnum">${fa(closed.filter((x) => x.status === "approved").length)}</b><span>تأییدشده</span></div>
        <div class="countbox ${closed.some((x) => x.status === "returned") ? "bad" : ""}"><b class="tnum">${fa(closed.filter((x) => x.status === "returned").length)}</b><span>اعاده‌شده</span></div>
        <div class="countbox"><b class="tnum">${fa(all.length)}</b><span>کل ارسال‌ها</span></div>
      </div>
    </div>

    ${all.length === 0 ? `
      <div class="empty" style="margin-top:1rem">
        <span class="glyph">📭</span>
        <p style="font-weight:500">کارتابل خالی است</p>
        <p class="muted small" style="max-width:30rem">
          ارسال از داخل سند انجام می‌شود: سند را باز کنید و به تب «ارسال و تأیید» بروید.
        </p>
      </div>` : ""}

    ${group(boss ? "در انتظار بررسی شما" : "در انتظار پاسخ مدیر",
            boss ? "" : "تا وقتی مدیر تصمیمی نگرفته، اینجا می‌ماند.", open)}
    ${group("پاسخ‌داده‌شده",
            unreadClosed && !boss ? "موارد نشان‌دار هنوز خوانده نشده‌اند." : "", closed)}`;
}

function submRow(sub) {
  const k = SUBMISSION_KIND[sub.kind];
  const st = SUBMISSION_STATUS[sub.status];
  const last = sub.replies[sub.replies.length - 1];
  return `
    <div class="subm ${sub.status} ${isUnread(sub) ? "unread" : ""}" data-subm="${sub.id}">
      <div class="spread">
        <div style="min-width:0">
          <p class="stitle" style="font-weight:500">${k.glyph} ${esc(sub.docTitle)}</p>
          <p class="muted small tnum" style="margin-top:.2rem">
            ${k.label} · ${esc(ROLES[sub.from].name)} · ${esc(sub.at)}
          </p>
        </div>
        <span class="badge badge-${st.tone}">${st.label}</span>
      </div>
      <p class="note">«${esc(sub.note)}»</p>
      ${sub.assignmentTask ? `<p class="muted small" style="margin-top:.35rem">دربارهٔ کار واگذارشده: ${esc(sub.assignmentTask)}</p>` : ""}
      ${last ? `<p class="muted small" style="margin-top:.35rem">
        ${esc(ROLES[last.role].name)} — ${esc(DECISIONS[last.action].label)}${last.text ? "، «" + esc(last.text) + "»" : ""}
      </p>` : ""}
    </div>`;
}

/* The same thread, wherever it is read from. */
function submThread(sub) {
  if (!sub.replies.length) return `<p class="muted small">مدیر هنوز پاسخی ثبت نکرده است.</p>`;
  return sub.replies.map((r) => `
    <div class="comment ${DECISIONS[r.action].tone || r.role}">
      <div class="spread">
        <span class="who">${ROLES[r.role].glyph} ${esc(r.who)} — ${esc(DECISIONS[r.action].label)}</span>
        <span class="muted small tnum">${esc(r.at)}</span>
      </div>
      ${r.text ? `<p style="margin-top:.35rem">${esc(r.text)}</p>` : ""}
    </div>`).join("");
}

/* What the manager may do about it, right where they are reading it. */
function submActions(sub) {
  if (!can("decide")) {
    return sub.status === "pending"
      ? `<p class="muted small">در انتظار بررسی ${esc(ROLES.manager.name)}.</p>`
      : `<p class="muted small">این مورد بسته شده است. اگر لازم است، از داخل سند دوباره ارسال کنید.</p>`;
  }
  const close = sub.kind === "approval"
    ? `<button class="btn btn-primary btn-sm" data-decide="${sub.id}:approve">✓ تأیید نهایی</button>`
    : `<button class="btn btn-primary btn-sm" data-decide="${sub.id}:acknowledge">✓ خوانده شد</button>`;
  return `
    <label class="label" for="sub-note" style="margin-top:.875rem">یادداشت شما ${sub.status === "pending" ? "(اختیاری)" : ""}</label>
    <textarea class="field" id="sub-note" rows="2" placeholder="اگر نکته‌ای دارید بنویسید؛ روی سند هم ثبت می‌شود."></textarea>
    <div class="row" style="margin-top:.75rem">
      ${close}
      <button class="btn btn-secondary btn-sm" data-decide="${sub.id}:return">↩ اعاده برای اصلاح</button>
      <button class="btn btn-ghost btn-sm" data-decide="${sub.id}:note">ثبت یادداشت بدون تصمیم</button>
    </div>`;
}

/* --- archive ------------------------------------------------------------ */

/* Archive dates are written the way the documents are: ۱۳۹۶/۰۳/۱۰. Folded to
   digits they sort chronologically as plain text, which is all a range filter
   needs. */
function asciiDigits(v) {
  return String(v == null ? "" : v).replace(/[۰-۹]/g, (d) => String("۰۱۲۳۴۵۶۷۸۹".indexOf(d)));
}

/* Whatever a person types, the archive stores one written form: ۱۴۰۵/۰۶/۱۵.
   A date that cannot be read is kept as the person wrote it and marked
   undated, rather than silently becoming a wrong date. */
function normalizeJalali(raw) {
  const t = asciiDigits(raw).trim();
  if (!t) return null;
  let m = /^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})$/.exec(t);
  if (m) {
    const y = +m[1], mo = +m[2], d = +m[3];
    if (mo < 1 || mo > 12 || d < 1 || d > 31) return null;
    if (y >= 1900) { const j = toJalali(y, mo, d); return fa(j[0] + "/" + pad2(j[1]) + "/" + pad2(j[2])); }
    return fa(y + "/" + pad2(mo) + "/" + pad2(d));
  }
  m = /^(\d{1,2})\s+(\S+)\s+(\d{4})$/.exec(t);
  if (m) {
    const idx = JMONTHS.findIndex((x) => x === m[2]);
    if (idx !== -1) return fa(+m[3] + "/" + pad2(idx + 1) + "/" + pad2(+m[1]));
  }
  return null;
}

function jYear(dateStr) {
  const t = asciiDigits(dateStr);
  const m = /(\d{4})/.exec(t);
  if (!m) return null;
  const y = +m[1];
  if (y >= 1200 && y <= 1499) return y;
  if (y >= 1900 && y <= 2200) {
    const g = /(\d{4})-(\d{1,2})-(\d{1,2})/.exec(t);
    return g ? toJalali(+g[1], +g[2], +g[3])[0] : y - 621;
  }
  return null;
}

function viewArchive() {
  const all = archiveAll();
  const q = (state.archiveQuery || "").trim();
  const kind = state.archiveKind || "";
  const from = state.archiveFrom ? +state.archiveFrom : null;
  const to = state.archiveTo ? +state.archiveTo : null;

  const years = [...new Set(all.map((d) => jYear(d.date)).filter(Boolean))].sort();

  // The same retrieval the chat uses, with the thresholds a search box wants:
  // «قراردادها» has to find «قرارداد», and a word the archive does not use is
  // not grounds for refusing to answer.
  const ranked = q ? searchDocs(q, all, {
    minCoverage: 0.2, minScore: 0.05, minUnderstood: 0,
    requireDiscriminating: false, limit: 500,
  }) : null;
  const quotes = {};
  if (ranked) ranked.forEach((r) => { quotes[r.doc.id] = r.quote; });

  let hiddenUndated = 0;
  const list = (ranked ? ranked.map((r) => r.doc) : all).filter((d) => {
    if (kind && d.kind !== kind) return false;
    if (!from && !to) return true;
    const y = jYear(d.date);
    // A document with no readable date is not "outside the range" — it is
    // unfiled, and saying so out loud beats dropping it without a word.
    if (y == null) { hiddenUndated += 1; return false; }
    if (from && y < from) return false;
    if (to && y > to) return false;
    return true;
  });

  const kinds = [...new Set(all.map((d) => d.kind))];
  const yearOptions = (selected) => years.map((y) =>
    `<option value="${y}" ${String(selected) === String(y) ? "selected" : ""}>${fa(y)}</option>`).join("");

  return `
    <div class="spread" style="margin-bottom:1.5rem">
      <div>
        <h1 style="font-size:1.5rem;font-weight:600">بایگانی</h1>
        <p class="muted small" style="margin-top:.25rem">
          همهٔ اسناد ثبت‌شده — صورت‌جلسه، نامه، قرارداد، گزارش، مصوبه، قانون و یادداشت.
        </p>
      </div>
      <button class="btn btn-primary" data-add-doc>+ افزودن سند</button>
    </div>

    <div class="card" style="margin-bottom:1rem">
      <div class="row">
        <input class="field" id="arch-q" style="flex:1;min-width:14rem" placeholder="جست‌وجو در عنوان، شماره یا متن سند…" value="${esc(state.archiveQuery || "")}">
        <button class="btn btn-secondary" data-arch-search>جست‌وجو</button>
      </div>

      <div class="filters">
        <div class="filter-group">
          <span class="label" style="margin:0">تاریخ</span>
          <select class="field field-sm" id="arch-from"><option value="">از ابتدا</option>${yearOptions(state.archiveFrom)}</select>
          <span class="muted small">تا</span>
          <select class="field field-sm" id="arch-to"><option value="">امروز</option>${yearOptions(state.archiveTo)}</select>
          ${(state.archiveFrom || state.archiveTo || kind || q) ? `<button class="btn btn-ghost btn-sm" data-clear-filters>حذف فیلترها</button>` : ""}
        </div>
      </div>

      <div class="row" style="margin-top:.75rem">
        <button class="btn btn-sm ${kind === "" ? "btn-secondary" : "btn-ghost"}" data-kind="">همه (${fa(all.length)})</button>
        ${kinds.map((k) => `
          <button class="btn btn-sm ${kind === k ? "btn-secondary" : "btn-ghost"}" data-kind="${k}">
            ${DOC_KINDS[k].glyph} ${DOC_KINDS[k].label} (${fa(all.filter((d) => d.kind === k).length)})
          </button>`).join("")}
      </div>
    </div>

    <p class="muted small tnum" style="margin-bottom:.5rem">
      ${fa(list.length)} سند از ${fa(all.length)} سند نمایش داده می‌شود${q ? " — به ترتیب نزدیکی به عبارت جست‌وجو" : ""}
    </p>
    ${hiddenUndated ? `<div class="alert alert-warning" style="margin-bottom:.75rem">
      ${fa(hiddenUndated)} سند تاریخ خوانا ندارد و با فیلتر تاریخ نمایش داده نمی‌شود.
      <button class="linkish" style="color:inherit" data-clear-dates>حذف فیلتر تاریخ</button>
    </div>` : ""}

    ${list.length === 0 ? `
      <div class="empty">
        <span class="glyph">📁</span>
        <p style="font-weight:500">سندی با این مشخصات پیدا نشد</p>
        <p class="muted small">فیلتر را بردارید یا سند تازه‌ای اضافه کنید.</p>
      </div>` : `
      <div class="card" style="padding:.5rem">
        <div class="stack" style="gap:.5rem">${list.map((d) => docRow(d, quotes[d.id])).join("")}</div>
      </div>`}

    <div class="demo-note" style="margin-top:1.5rem">
      <span>هرچه در «ورود دیتا» ثبت شود، همان لحظه به این بایگانی اضافه و قابل جست‌وجو می‌شود.</span>
      <button class="btn btn-ghost btn-sm" data-go="dashboard">رفتن به ورود دیتا</button>
    </div>`;
}

function docRow(d, quote) {
  const k = DOC_KINDS[d.kind];
  const meta = state.docMeta[d.id];
  const bits = [d.date, d.party].filter(Boolean);
  if (d.ref) bits.splice(1, 0, "شمارهٔ " + d.ref);
  if (d.amount) bits.push(d.amount);
  return `
    <div class="source-row" data-doc="${d.id}" style="cursor:pointer">
      <span class="glyph">${k.glyph}</span>
      <div class="info">
        <p class="fname">${esc(d.title)}</p>
        <p class="fmeta tnum">${bits.map(esc).join(" · ")}</p>
        ${quote ? `<p class="hit-quote" style="margin-top:.3rem">«${esc(quote)}»</p>` : ""}
      </div>
      ${meta && meta.comments.length ? `<span class="chip">💬 ${fa(meta.comments.length)}</span>` : ""}
      ${meta && meta.assignment && meta.assignment.status === "open"
        ? `<span class="badge badge-warning">واگذارشده</span>` : ""}
      ${submissionsFor(d.id).some((x) => x.status === "pending")
        ? `<span class="badge badge-brand">در انتظار تأیید</span>` : ""}
      <span class="badge badge-${k.tone}">${k.label}</span>
      ${d.fromMeeting ? `<span class="badge badge-success">از ورود دیتا</span>` : ""}
    </div>`;
}

function wire() {
  const $ = (sel) => Array.prototype.slice.call(document.querySelectorAll(sel));
  const on = (sel, ev, fn) => $(sel).forEach((el) => el.addEventListener(ev, fn));

  /* ---- role ---- */
  on("[data-role]", "click", (e) => {
    state.role = e.currentTarget.dataset.role;
    toast("اکنون به عنوان " + me().label + " وارد شده‌اید");
    render();
  });

  /* ---- subjects & the chat ---- */
  on("[data-open-case]", "click", (e) => go({ name: "case", id: e.currentTarget.dataset.openCase }));
  on("[data-new-case]", "click", () => toast("در نسخهٔ نمونه، موضوع‌ها از پیش ساخته شده‌اند"));

  const sendChat = () => {
    const box = document.getElementById("chat-q");
    const text = (box && box.value || "").trim();
    if (!text || state.chatBusy) return;
    box.value = "";
    askChat(state.route.id, text);
  };
  on("[data-chat-send]", "click", sendChat);
  on("[data-ask]", "click", (e) => {
    if (state.chatBusy) return;
    askChat(state.route.id, e.currentTarget.dataset.ask);
  });
  const chatBox = document.getElementById("chat-q");
  if (chatBox) {
    chatBox.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); sendChat(); } });
    if (state.chat[state.route.id] && state.chat[state.route.id].length) chatBox.focus();
  }
  const log = document.querySelector(".chat-log");
  if (log) log.scrollTop = log.scrollHeight;

  /* ---- one document's record ---- */
  on("[data-doc]", "click", (e) => {
    const doc = archiveAll().find((d) => d.id === e.currentTarget.dataset.doc);
    if (doc) { state.docTab = "comments"; state.modal = { type: "doc", doc: doc }; render(); }
  });

  on("[data-doc-tab]", "click", (e) => { state.docTab = e.currentTarget.dataset.docTab; render(); });

  /* ---- the tray ---- */
  on("[data-subm]", "click", (e) => {
    const id = e.currentTarget.dataset.subm;
    const sub = state.submissions.find((x) => x.id === id);
    if (!sub) return;
    sub.seen[state.role] = true;          // opening it is reading it
    state.modal = { type: "submission", id: id };
    render();
  });

  on("[data-decide]", "click", (e) => {
    if (!requires("decide")) return;
    const [id, action] = e.currentTarget.dataset.decide.split(":");
    const sub = state.submissions.find((x) => x.id === id);
    if (!sub) return;
    const box = document.getElementById("sub-note");
    const text = (box && box.value || "").trim();
    if (action === "note" && !text) { toast("یادداشتی ننوشته‌اید"); return; }
    decideOn(sub, action, text);
    toast(DECISIONS[action].label + " ثبت شد");
    // A decision closes the item, so it closes the window it was read in —
    // but only when the item was opened from the tray. A note settles nothing,
    // and a decision taken while reading the document leaves you on the
    // document, where you were.
    if (DECISIONS[action].status && state.modal && state.modal.type === "submission") state.modal = null;
    render();
  });

  on("[data-submit-doc]", "click", (e) => {
    if (!requires("submit")) return;
    const id = e.currentTarget.dataset.submitDoc;
    const doc = archiveAll().find((x) => x.id === id);
    const note = (document.getElementById("sb-note").value || "").trim();
    if (!note) { toast("بنویسید چه چیزی را برای مدیر می‌فرستید"); return; }
    const kind = document.getElementById("sb-kind").value;
    submit(id, doc ? doc.title : id, kind, note, null);
    toast(kind === "approval" ? "برای تأیید مدیر فرستاده شد" : "گزارش به کارتابل مدیر رفت");
    render();
  });

  on("[data-submit-minutes]", "click", (e) => {
    if (!requires("submit")) return;
    const docId = "m-" + e.currentTarget.dataset.submitMinutes;
    const doc = archiveAll().find((x) => x.id === docId);
    if (!doc) { toast("این ورودی هنوز در بایگانی ثبت نشده است"); return; }
    // Composing happens in one place: the document's own tray tab.
    state.docTab = "approval";
    state.modal = { type: "doc", doc: doc };
    render();
  });

  on("[data-add-comment]", "click", (e) => {
    const box = document.getElementById("cm-text");
    const text = (box && box.value || "").trim();
    if (!text) { toast("چیزی بنویسید"); return; }
    addComment(e.currentTarget.dataset.addComment, text);
    toast("یادداشت ثبت شد");
    render();
  });

  on("[data-save-doc-title]", "click", (e) => {
    const id = e.currentTarget.dataset.saveDocTitle;
    const box = document.getElementById("ch-title");
    const next = (box && box.value || "").trim();
    const doc = archiveAll().find((d) => d.id === id);
    if (!doc || !next || next === doc.title) { toast("تغییری وارد نشد"); return; }
    addChange(id, "عنوان سند", doc.title, next);
    if (doc.fromMeeting) {
      // Documents from "ورود دیتا" are derived fresh on every render, so writing
      // to the derived copy would be undone by the next one.
      const m = state.meetings.find((x) => x.id === doc.fromMeeting);
      if (m) { m.title = next; if (m.minutes) m.minutes.title = next; }
    } else {
      doc.title = next;
    }
    if (state.modal) state.modal.doc = archiveAll().find((d) => d.id === id) || doc;
    toast("اصلاح ثبت شد");
    render();
  });

  on("[data-assign]", "click", (e) => {
    if (!requires("assign")) return;
    const id = e.currentTarget.dataset.assign;
    const task = (document.getElementById("as-task").value || "").trim();
    if (!task) { toast("شرح کار را بنویسید"); return; }
    docMeta(id).assignment = {
      to: "secretary", by: me().name, at: stamp(), task: task,
      due: (document.getElementById("as-due").value || "").trim() || null,
      status: "open", done: null,
    };
    toast("کار به منشی واگذار شد");
    render();
  });

  on("[data-assign-done]", "click", (e) => {
    if (!requires("completeAssignment")) return;
    const id = e.currentTarget.dataset.assignDone;
    const a = docMeta(id).assignment;
    const box = document.getElementById("as-report");
    const text = (box && box.value || "").trim();
    a.status = "done"; a.done = stamp();
    if (text) {
      // Finishing the work and reporting it are one move, not two.
      const doc = archiveAll().find((x) => x.id === id);
      submit(id, doc ? doc.title : id, "report", text, a.task);
      toast("انجام کار اعلام و گزارش به کارتابل مدیر فرستاده شد");
    } else {
      toast("انجام کار اعلام شد — بدون گزارش");
    }
    render();
  });

  on("[data-assign-reopen]", "click", (e) => {
    if (!requires("assign")) return;
    const a = docMeta(e.currentTarget.dataset.assignReopen).assignment;
    a.status = "open"; a.done = null;
    toast("کار دوباره باز شد");
    render();
  });

  on("[data-assign-remind]", "click", () => {
    if (!requires("assign")) return;
    toast("یادآوری برای منشی فرستاده شد");
  });

  on("[data-add-doc]", "click", () => { state.modal = { type: "adddoc", draft: {} }; render(); });

  const filePick = document.getElementById("nd-file");
  if (filePick) filePick.addEventListener("change", (e) => {
    const file = e.currentTarget.files && e.currentTarget.files[0];
    if (!file) return;
    const titleBox = document.getElementById("nd-title");
    if (titleBox && !titleBox.value.trim()) {
      titleBox.value = file.name.replace(/\.[^.]+$/, "");
    }
    toast("فایل «" + file.name + "» انتخاب شد");
  });

  on("[data-save-doc]", "click", () => {
    const val = (id) => (document.getElementById(id).value || "").trim();
    const title = val("nd-title");
    if (!title) { toast("عنوان سند را بنویسید"); return; }
    const caseId = val("nd-case");
    const rawDate = val("nd-date");
    const onDate = normalizeJalali(rawDate);
    if (rawDate && !onDate) toast("تاریخ خوانده نشد و همان‌طور که نوشتید ثبت می‌شود");
    ARCHIVE.unshift({
      id: nid("doc"),
      kind: val("nd-kind") || "contract",
      title: title,
      date: onDate || rawDate || "بدون تاریخ",
      ref: val("nd-ref") || null,
      party: val("nd-party") || null,
      cases: caseId ? [caseId] : [],
      text: val("nd-text") || "متن این سند وارد نشده است.",
    });
    state.modal = null;
    toast("سند به بایگانی افزوده شد");
    render();
  });

  on("[data-kind]", "click", (e) => { state.archiveKind = e.currentTarget.dataset.kind; render(); });
  const bindSelect = (id, key) => {
    const el = document.getElementById(id);
    if (el) el.addEventListener("change", () => { state[key] = el.value; render(); });
  };
  bindSelect("arch-from", "archiveFrom");
  bindSelect("arch-to", "archiveTo");
  on("[data-clear-dates]", "click", () => {
    state.archiveFrom = ""; state.archiveTo = ""; render();
  });
  on("[data-clear-filters]", "click", () => {
    state.archiveFrom = ""; state.archiveTo = ""; state.archiveKind = ""; state.archiveQuery = "";
    render();
  });
  on("[data-arch-search]", "click", () => {
    const box = document.getElementById("arch-q");
    state.archiveQuery = box ? box.value : "";
    render();
  });
  const archBox = document.getElementById("arch-q");
  if (archBox) archBox.addEventListener("keydown", (e) => {
    if (e.key === "Enter") { state.archiveQuery = e.currentTarget.value; render(); }
  });

  on("[data-go]", "click", (e) => {
    const to = e.currentTarget.dataset.go;
    if (to === "landing") go({ name: "landing" });
    else go({ name: to });
  });

  on("[data-auth]", "click", (e) => {
    state.authTab = e.currentTarget.dataset.auth;
    state.authError = null;
    go({ name: "auth" });
  });

  on("[data-reset]", "click", () => {
    confirmModal("بازنشانی دمو",
      "همهٔ ورودی‌ها، یادداشت‌ها و اسنادی که در این مرورگر ثبت کرده‌اید پاک می‌شود و دمو به حالت اولیه برمی‌گردد.",
      "بازنشانی", true, resetDemo);
  });

  on("[data-logout]", "click", () => { state.user = null; go({ name: "landing" }); });

  const authForm = document.getElementById("auth-form");
  if (authForm) authForm.addEventListener("submit", (e) => {
    e.preventDefault();
    const email = (document.getElementById("au-email").value || "").trim();
    const pass = document.getElementById("au-pass").value || "";
    if (!email || !email.includes("@")) { state.authError = "ایمیل معتبر وارد کنید."; return render(); }
    if (pass.length < 8) { state.authError = "رمز عبور باید حداقل ۸ کاراکتر باشد."; return render(); }
    const nameEl = document.getElementById("au-name");
    state.user = { email: email, name: nameEl ? nameEl.value : "کاربر نمونه" };
    state.authError = null;
    if (!state.meetings.length) state.meetings = seedMeetings();
    toast("خوش آمدید");
    go({ name: "dashboard" });
  });

  on("[data-open]", "click", (e) => go({ name: "meeting", id: e.currentTarget.dataset.open }));

  const newForm = document.getElementById("new-form");
  if (newForm) newForm.addEventListener("submit", (e) => {
    e.preventDefault();
    const title = (document.getElementById("nm-title").value || "").trim();
    const date = document.getElementById("nm-date").value;
    const kind = document.getElementById("nm-kind").value;
    const m = {
      id: nid("m"),
      kind: kind,
      title: title || (DOC_KINDS[kind].label + " بدون عنوان"),
      date: date || null,
      time: (document.getElementById("nm-time").value || "").trim() || null,
      location: null,
      description: (document.getElementById("nm-desc").value || "").trim() || null,
      status: "draft", sources: [], minutes: null, job: null, versions: [],
    };
    state.meetings.unshift(m);
    toast("ورودی ساخته شد — حالا محتوای آن را اضافه کنید");
    go({ name: "meeting", id: m.id });
  });

  on("[data-add-text]", "click", () => {
    const box = document.getElementById("text-in");
    const text = (box && box.value || "").trim();
    if (text.length < 10) { toast("متن کوتاه‌تر از آن است که سندی باشد"); return; }
    const m = currentMeeting();
    if (!m) return;
    m.sources.push({
      id: nid("s"), name: "متن واردشده.txt", type: "document", status: "uploaded",
      size: text.length * 2, text: text, chars: text.length,
    });
    if (m.status === "draft") m.status = "uploaded";
    box.value = "";
    toast("متن به این ورودی افزوده شد");
    render();
  });

  /* --- uploads --- */
  const zone = document.querySelector("[data-drop]");
  const input = document.getElementById("file-input");
  if (zone && input) {
    const m = currentMeeting();
    const busy = m && m.status === "processing";
    zone.addEventListener("click", () => { if (!busy) input.click(); });
    zone.addEventListener("keydown", (e) => { if (!busy && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); input.click(); } });
    zone.addEventListener("dragover", (e) => { e.preventDefault(); if (!busy && !state.dragging) { state.dragging = true; zone.classList.add("drag"); } });
    zone.addEventListener("dragleave", () => { state.dragging = false; zone.classList.remove("drag"); });
    zone.addEventListener("drop", (e) => {
      e.preventDefault(); state.dragging = false;
      if (!busy) addFiles(e.dataTransfer.files);
    });
    input.addEventListener("change", (e) => { addFiles(e.target.files); e.target.value = ""; });
  }

  on("[data-remove-source]", "click", (e) => {
    if (!requires("removeRecord")) return;
    const m = currentMeeting();
    const id = e.currentTarget.dataset.removeSource;
    const s = m.sources.find((x) => x.id === id);
    confirmModal("حذف منبع", "«" + s.name + "» حذف شود؟", "حذف", true, () => {
      m.sources = m.sources.filter((x) => x.id !== id);
      if (!m.sources.length && !m.minutes) m.status = "draft";
      toast("منبع حذف شد");
      state.modal = null; render();
    });
  });

  on("[data-view-source]", "click", (e) => {
    const m = currentMeeting();
    const s = m.sources.find((x) => x.id === e.currentTarget.dataset.viewSource);
    state.modal = { type: "source", source: s }; render();
  });

  on("[data-download-source]", "click", (e) => {
    toast("در نسخهٔ نمایشی دانلود فعال نیست: " + e.currentTarget.dataset.downloadSource);
  });

  on("[data-retry]", "click", () => { toast("برای تلاش دوباره، پردازش را دوباره اجرا کنید."); });

  /* --- processing --- */
  on("[data-process]", "click", () => runPipeline(currentMeeting(), false));
  on("[data-regenerate]", "click", () => {
    confirmModal("تولید مجدد صورت‌جلسه",
      "صورت‌جلسه دوباره تولید می‌شود. نسخهٔ فعلی حذف نمی‌شود و در تاریخچه باقی می‌ماند.",
      "تولید مجدد", false, () => { state.modal = null; runPipeline(currentMeeting(), true); });
  });

  /* --- minutes editing --- */
  on("[data-edit-title]", "click", () => { resetEditing(); state.editingTitle = true; render(); });
  on("[data-save-title]", "click", () => {
    const m = currentMeeting();
    const v = (document.getElementById("ed-title").value || "").trim();
    if (!v) return toast("عنوان صورت‌جلسه نمی‌تواند خالی باشد.");
    m.minutes.title = v; bumpVersion(m, "user_edit"); resetEditing();
    toast("ذخیره شد"); render();
  });

  on("[data-edit-summary]", "click", () => { resetEditing(); state.editingSummary = true; render(); });
  on("[data-save-summary]", "click", () => {
    const m = currentMeeting();
    m.minutes.summary = document.getElementById("ed-summary").value.trim();
    bumpVersion(m, "user_edit"); resetEditing(); toast("ذخیره شد"); render();
  });

  on("[data-edit-action]", "click", (e) => { resetEditing(); state.editingAction = e.currentTarget.dataset.editAction; render(); });
  on("[data-save-action]", "click", (e) => {
    const m = currentMeeting();
    const a = m.minutes.actions.find((x) => x.id === e.currentTarget.dataset.saveAction);
    const title = (document.getElementById("ac-title").value || "").trim();
    if (!title) return toast("عنوان اقدام نمی‌تواند خالی باشد.");
    a.title = title;
    a.desc = (document.getElementById("ac-desc").value || "").trim() || null;
    const owner = (document.getElementById("ac-owner").value || "").trim();
    a.owner = owner || null;
    a.ownerConfirmed = !!owner;                       // a name typed by a person is confirmed
    a.deadline = document.getElementById("ac-deadline").value || null;
    a.deadlineText = a.deadline ? null : ((document.getElementById("ac-dtext").value || "").trim() || null);
    a.status = document.getElementById("ac-status").value;
    a.priority = document.getElementById("ac-priority").value || null;
    bumpVersion(m, "user_edit"); resetEditing(); toast("اقدام ذخیره شد"); render();
  });
  on("[data-delete-action]", "click", (e) => {
    if (!requires("removeRecord")) return;
    const m = currentMeeting(); const id = e.currentTarget.dataset.deleteAction;
    m.minutes.actions = m.minutes.actions.filter((x) => x.id !== id);
    bumpVersion(m, "user_edit"); resetEditing(); toast("اقدام حذف شد"); render();
  });
  on("[data-status-for]", "change", (e) => {
    const m = currentMeeting();
    const a = m.minutes.actions.find((x) => x.id === e.currentTarget.dataset.statusFor);
    a.status = e.currentTarget.value;
    bumpVersion(m, "user_edit"); toast("وضعیت به‌روزرسانی شد"); render();
  });

  on("[data-add-action]", "click", () => { resetEditing(); state.addingAction = true; render(); });
  on("[data-save-new-action]", "click", () => {
    const m = currentMeeting();
    const title = (document.getElementById("new-action-title").value || "").trim();
    if (!title) return toast("عنوان اقدام نمی‌تواند خالی باشد.");
    m.minutes.actions.push({ id: nid("a"), title: title, desc: null, owner: null, ownerConfirmed: false,
      deadline: null, deadlineText: null, priority: null, status: "open", evidence: [] });
    bumpVersion(m, "user_edit"); resetEditing(); toast("اقدام افزوده شد"); render();
  });

  on("[data-edit-decision]", "click", (e) => { resetEditing(); state.editingDecision = e.currentTarget.dataset.editDecision; render(); });
  on("[data-save-decision]", "click", (e) => {
    const m = currentMeeting();
    const d = m.minutes.decisions.find((x) => x.id === e.currentTarget.dataset.saveDecision);
    const t = (document.getElementById("dec-text").value || "").trim();
    if (!t) return toast("متن تصمیم نمی‌تواند خالی باشد.");
    d.text = t;
    d.context = (document.getElementById("dec-ctx").value || "").trim() || null;
    d.by = (document.getElementById("dec-by").value || "").trim() || null;
    bumpVersion(m, "user_edit"); resetEditing(); toast("تصمیم ذخیره شد"); render();
  });
  on("[data-delete-decision]", "click", (e) => {
    if (!requires("removeRecord")) return;
    const m = currentMeeting(); const id = e.currentTarget.dataset.deleteDecision;
    m.minutes.decisions = m.minutes.decisions.filter((x) => x.id !== id);
    bumpVersion(m, "user_edit"); resetEditing(); toast("تصمیم حذف شد"); render();
  });

  on("[data-cancel-edit]", "click", () => { resetEditing(); render(); });

  /* --- evidence / versions / export --- */
  on("[data-evidence]", "click", (e) => {
    const m = currentMeeting();
    const [kind, id] = e.currentTarget.dataset.evidence.split(":");
    const pool = kind === "action" ? m.minutes.actions : kind === "decision" ? m.minutes.decisions : m.minutes.proposals;
    const item = pool.find((x) => x.id === id);
    if (!item || !item.evidence.length) return toast("برای این مورد منبعی ثبت نشده است.");
    state.modal = { type: "evidence", items: item.evidence }; render();
  });

  /* --- naming the separated voices --- */
  on("[data-spk-name]", "input", (e) => {
    // Deliberately no re-render: that would steal focus mid-word.
    state.modal.draft = Object.assign({}, state.modal.draft || {}, {
      [e.currentTarget.dataset.spkName]: e.currentTarget.value,
    });
  });

  on("[data-spk-save]", "click", () => {
    const src = state.modal.source;
    const draft = state.modal.draft || {};
    Object.keys(draft).forEach((label) => {
      const value = draft[label].trim();
      if (value) src.speakerNames[label] = value;
      else delete src.speakerNames[label];  // cleared name = anonymous again
    });
    // The names have to reach the text, not just the panel: the transcript, the
    // quotes taken from it, and the archive all read src.text.
    src.text = speakerText(src);
    src.chars = src.text.length;
    state.modal = null;
    const m = currentMeeting();
    toast("نام گویندگان ذخیره شد");
    // The panel says naming re-runs the analysis of this source. It does.
    if (m && m.minutes) runPipeline(m, true);
    else render();
  });

  on("[data-versions]", "click", () => { state.modal = { type: "versions" }; render(); });
  on("[data-view-version]", "click", (e) => {
    const m = currentMeeting();
    const n = +e.currentTarget.dataset.viewVersion;
    const v = m.versions.find((x) => x.n === n);
    if (!v || !v.snapshot) return toast("متن این نسخه ذخیره نشده است.");
    state.modal = { type: "oldVersion", n: n, minutes: v.snapshot, at: v.at, origin: v.origin };
    render();
  });

  on("[data-export]", "click", (e) => {
    state.modal = { type: "export", format: e.currentTarget.dataset.export }; render();
  });

  on("[data-delete-meeting]", "click", (e) => {
    if (!requires("removeRecord")) return;
    const id = e.currentTarget.dataset.deleteMeeting;
    confirmModal("حذف جلسه",
      "این جلسه و همهٔ فایل‌ها و صورت‌جلسه‌های آن برای همیشه حذف می‌شود. مطمئن هستید؟",
      "حذف جلسه", true, () => {
        state.meetings = state.meetings.filter((x) => x.id !== id);
        toast("جلسه حذف شد");
        go({ name: "dashboard" });
      });
  });

  on("[data-close-modal]", "click", () => { state.modal = null; render(); });
  on("[data-overlay]", "click", (e) => { if (e.target === e.currentTarget) { state.modal = null; render(); } });
  on("[data-confirm-yes]", "click", () => { const fn = state.modal && state.modal.onYes; if (fn) fn(); });
}

/* --- what is on the record for one document ------------------------------ */

function whoLine(entry) {
  return `<span class="who">${ROLES[entry.role].glyph} ${esc(entry.who)}</span>
          <span class="muted small tnum">${esc(entry.at)}</span>`;
}

function docComments(d, meta) {
  return `
    <div class="panel">
      ${meta.comments.length === 0
        ? `<p class="muted small">هنوز کسی دربارهٔ این سند چیزی ننوشته است.</p>`
        : meta.comments.map((c) => `
          <div class="comment ${c.role}">
            <div class="spread">${whoLine(c)}</div>
            <p style="margin-top:.35rem">${esc(c.text)}</p>
          </div>`).join("")}

      <div style="margin-top:.875rem">
        <label class="label" for="cm-text">یادداشت شما به عنوان ${esc(me().label)}</label>
        <textarea class="field" id="cm-text" rows="2" placeholder="نکته‌ای دربارهٔ این سند بنویسید…"></textarea>
        <div class="row" style="margin-top:.5rem">
          <button class="btn btn-secondary btn-sm" data-add-comment="${d.id}">ثبت یادداشت</button>
        </div>
      </div>
    </div>`;
}

function docChanges(d, meta) {
  return `
    <div class="panel">
      ${meta.changes.length === 0
        ? `<p class="muted small">این سند از زمان ثبت تغییری نکرده است.</p>`
        : meta.changes.map((c) => `
          <div class="change">
            <div class="spread">${whoLine(c)}</div>
            <p style="margin-top:.35rem">
              ${esc(c.what)}:
              <span class="was">${esc(c.from || "—")}</span>
              <span class="arrow">←</span>
              <span class="now">${esc(c.to)}</span>
            </p>
          </div>`).join("")}

      <div style="margin-top:.875rem">
        <label class="label" for="ch-title">اصلاح عنوان سند</label>
        <div class="row">
          <input class="field" id="ch-title" style="flex:1;min-width:12rem" value="${esc(d.title)}">
          <button class="btn btn-secondary btn-sm" data-save-doc-title="${d.id}">ثبت اصلاح</button>
        </div>
        <p class="hint">هر اصلاحی با نام و تاریخ ثبت می‌شود؛ نسخهٔ قبلی پاک نمی‌شود.</p>

}

function docAssignment(d, meta) {
  const a = meta.assignment;

  if (!a) {
    if (!can("assign")) {
      return `<div class="panel"><p class="muted small">کاری روی این سند واگذار نشده است. واگذاری کار از عهدهٔ مدیر است.</p></div>`;
    }
    return `
      <div class="panel">
        <p class="muted small" style="margin-bottom:.75rem">کاری روی این سند واگذار نشده است.</p>
        <label class="label" for="as-task">شرح کاری که به منشی واگذار می‌کنید</label>
        <input class="field" id="as-task" placeholder="مثلاً: پیگیری پاسخ این نامه">

          <span class="badge badge-${a.status === "done" ? "success" : "warning"}">

        <p class="muted small tnum" style="margin-top:.35rem">
          واگذاری از ${esc(a.by)} · ${esc(a.at)} · مهلت: ${esc(a.due || "مشخص نشده")}
        </p>

      ${can("completeAssignment") && a.status === "open" ? `
        <div style="margin-top:.875rem">

      </div>

}

/* Sending up, and the answer coming back — read on the document itself, so
   the tray is a view of the record rather than a place records hide. */
function docApproval(d) {

  const pending = subs.filter((x) => x.status === "pending")[0];
  return `
    <div class="panel">
      ${subs.length
        ? `<div class="stack" style="gap:.625rem">${subs.map(submRow).join("")}</div>`

      ${pending && can("decide") ? `
        <div style="border-top:1px solid var(--s-100);margin-top:.875rem;padding-top:.875rem">
          <p style="font-weight:500;font-size:.875rem">تصمیم شما دربارهٔ ارسال باز</p>
          ${submActions(pending)}
